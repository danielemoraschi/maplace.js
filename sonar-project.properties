sonar.projectKey=danielemoraschi_maplace.js_67eded01-7d25-4032-8941-bcd3f04fb5ad

sonar.sources=packages/maplace/src,packages/maplace/examples,scripts
sonar.tests=packages/maplace/src,scripts
# Tests and type tests are test code, never source code.
sonar.test.inclusions=**/*.test.ts,**/__typetests__/**
sonar.exclusions=**/*.test.ts,**/__typetests__/**

sonar.typescript.tsconfigPaths=tsconfig.json,scripts/tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Examples are documentation snippets and the check runner is a thin CLI: no unit tests.
# Keep the scripts part in step with coverage.exclude in vitest.config.ts.
sonar.coverage.exclusions=packages/maplace/examples/**,scripts/check.ts
# The example scenarios are parallel by design.
sonar.cpd.exclusions=packages/maplace/examples/**
