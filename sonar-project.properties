sonar.projectKey=danielemoraschi_maplace.js_67eded01-7d25-4032-8941-bcd3f04fb5ad

sonar.sources=packages/maplace/src,packages/maplace/examples,scripts
sonar.tests=packages/maplace/src,scripts
# Tests and type tests are test code, never source code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__typetests__/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__typetests__/**

sonar.typescript.tsconfigPaths=tsconfig.json,scripts/tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Examples are documentation snippets and scripts/*.ts are thin CLIs: no unit tests.
# Keep the scripts part in step with coverage.exclude in vitest.config.ts.
sonar.coverage.exclusions=packages/maplace/examples/**,packages/maplace/src/testing/**,packages/maplace/src/google/testing/**,packages/maplace/src/react/testing/**,scripts/*.ts,scripts/checks/consumer/**,scripts/checks/rsc-app/**,scripts/checks/server-components-build.ts
# The example scenarios are parallel by design.
sonar.cpd.exclusions=packages/maplace/examples/**
# Example pages load `maplace@1`, a moving version an SRI hash can't pin; P6 publishes
# version-pinned URLs with SRI hashes.
sonar.issue.ignore.multicriteria=sri,conformanceRunners
sonar.issue.ignore.multicriteria.sri.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.sri.resourceKey=packages/maplace/examples/**/*.html
# A conformance runner registers its tests through describeConformance, which S2187 can't see.
sonar.issue.ignore.multicriteria.conformanceRunners.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.conformanceRunners.resourceKey=**/conformance.browser.test.ts
