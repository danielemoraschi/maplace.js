name: CI

on:
  push:
  pull_request:
  # On next, runs the real Google Maps tests whatever changed.
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the last CI run passed on next, for scripts/real-maps.ts

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Same-repo PRs are already covered by their branch's push run; only fork PRs run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Room for a run whose Chromium packages come from a slow mirror, the cache cold (T23).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube reads blame to find new code
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      # Chromium's system packages come from Ubuntu's mirror, at times slowly enough to run out the
      # job's time (T23): apt keeps them between runs and fetches only what changed, the cache
      # saved before the tests so a run they cut short has warmed it.
      - id: chromium-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chromium-packages
          key: chromium-packages-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
          restore-keys: chromium-packages-${{ runner.os }}-
      - run: |
          mkdir -p "$HOME/.cache/chromium-packages/partial"
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$HOME/.cache/chromium-packages" | sudo tee /etc/apt/apt.conf.d/99-chromium-packages
      - run: npx --no playwright install --with-deps --only-shell chromium
      # apt wrote there as root, its lock readable by root alone: the cache is saved as the runner.
      - run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/chromium-packages"
      - if: steps.chromium-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chromium-packages
          key: ${{ steps.chromium-packages.outputs.cache-primary-key }}
      # Real Google Maps (T2) on next only: fork PRs get no secrets, and every map is billed, so
      # only when next changed more than prose or MapLibre's own files since the last commit CI
      # passed on it (scripts/real-maps.ts; a cancelled run's changes count too), or on a run
      # started by hand. Without the key the Maps tests would only skip, so a missing secret fails.
      - id: real-maps
        if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        env:
          GH_TOKEN: ${{ github.token }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          base=""
          if [ "$BY_HAND" != "true" ]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch next \
              --status success --limit 20 --json headSha,event \
              --jq 'map(select(.event != "pull_request"))[0].headSha // ""') || base=""
          fi
          node scripts/real-maps.ts "$base" >> "$GITHUB_OUTPUT"
      - if: steps.real-maps.outputs.run == 'true'
        env:
          VITE_MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: test -n "$VITE_MAPS_KEY" || { echo "::error::the MAPS_KEY secret is not set"; exit 1; }
      - run: npm test
        env:
          VITE_MAPS_KEY: ${{ steps.real-maps.outputs.run == 'true' && secrets.MAPS_KEY || '' }}
      - run: npm run coverage
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: sonar-${{ runner.os }}-
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        continue-on-error: true
        run: npm run sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
