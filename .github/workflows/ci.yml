name: CI

on:
  push:
  pull_request:
  # On next, runs the real Google Maps tests whatever changed.
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the last CI run passed on next, for scripts/real-maps.ts

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Same-repo PRs are already covered by their branch's push run; only fork PRs run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Room for a run whose Chromium packages come from a slow mirror, the cache cold (T23).
    timeout-minutes: 20
    steps:
      # Full history: SonarQube reads blame to find new code, and privacy-changed-on.test.ts the
      # privacy page's last change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      # Chromium's system packages come from Ubuntu's mirror, at times slowly enough to run out the
      # job's time (T23): apt keeps them between runs and fetches only what changed, the cache
      # saved before the tests so a run they cut short has warmed it.
      - id: chromium-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chromium-packages
          key: chromium-packages-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
          restore-keys: chromium-packages-${{ runner.os }}-
      - run: |
          mkdir -p "$HOME/.cache/chromium-packages/partial"
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$HOME/.cache/chromium-packages" | sudo tee /etc/apt/apt.conf.d/99-chromium-packages
      - run: npx --no playwright install --with-deps --only-shell chromium
      # apt wrote there as root, its lock readable by root alone: the cache is saved as the runner.
      - run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/chromium-packages"
      - if: steps.chromium-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chromium-packages
          key: ${{ steps.chromium-packages.outputs.cache-primary-key }}
      # Real Google Maps (T2) on next only: fork PRs get no secrets, and every map is billed, so
      # only when next changed more than prose or MapLibre's own files since the last commit verify
      # passed on (scripts/real-maps.ts; a cancelled run's changes count too), or on a run
      # started by hand. Without the key the Maps tests would only skip, so a missing secret fails.
      - id: real-maps
        if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        env:
          GH_TOKEN: ${{ github.token }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # The last run whose verify passed, whatever deploy-preview did after it.
          base=""
          if [ "$BY_HAND" != "true" ]; then
            for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch next \
              --status completed --limit 20 --json databaseId,event \
              --jq '.[] | select(.event != "pull_request") | .databaseId'); do
              base=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,jobs \
                --jq 'select(any(.jobs[]; .name == "verify" and .conclusion == "success")) | .headSha') || base=""
              [ -n "$base" ] && break
            done
          fi
          node scripts/real-maps.ts "$base" >> "$GITHUB_OUTPUT"
      - if: steps.real-maps.outputs.run == 'true'
        env:
          VITE_MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: test -n "$VITE_MAPS_KEY" || { echo "::error::the MAPS_KEY secret is not set"; exit 1; }
      - run: npm test
        env:
          VITE_MAPS_KEY: ${{ steps.real-maps.outputs.run == 'true' && secrets.MAPS_KEY || '' }}
      - run: npm run coverage
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: sonar-${{ runner.os }}-
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        continue-on-error: true
        run: npm run sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # The site from next, once it passed, as a Cloudflare version under the alias `next` (W10):
  # next-maplacejs.<subdomain>.workers.dev, behind Cloudflare Access; production is R4's. The
  # Worker was created once by hand: an upload can't create one.
  deploy-preview:
    needs: verify
    if: github.ref == 'refs/heads/next' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # it never pushes, and npm's install scripts run here
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Without them the maps would only say the site has no key, so missing ones fail.
      - run: |
          test -n "$SITE_MAPS_KEY" || { echo "::error::the SITE_MAPS_KEY secret is not set"; exit 1; }
          test -n "$SITE_MAPS_MAP_ID" || { echo "::error::the SITE_MAPS_MAP_ID variable is not set"; exit 1; }
          npm run site:build
        env:
          SITE_MAPS_KEY: ${{ secrets.SITE_MAPS_KEY }}
          SITE_MAPS_MAP_ID: ${{ vars.SITE_MAPS_MAP_ID }}
      # Kept out of search engines until R4, whatever Access lets through; added to the site's own.
      - run: |
          printf '/*\n  X-Robots-Tag: noindex\n' >> apps/site/dist/_headers
      # Wrangler and its install scripts fetched before the Cloudflare token is in the environment.
      - run: npx --yes wrangler@4.150.0 --version
      - working-directory: apps/site
        run: npx --yes wrangler@4.150.0 versions upload --preview-alias next --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # What the edge adds, which the build never sees (W10c): every page as a browser gets it,
      # through Access with its service token, may ask no one before consent but whom the privacy
      # page names.
      - run: node apps/site/src/site/offsite-check.ts https://next-maplacejs.dmoraschi-io.workers.dev
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
