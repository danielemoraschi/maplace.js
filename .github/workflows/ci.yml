name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Same-repo PRs are already covered by their branch's push run; only fork PRs run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube reads blame to find new code
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npx --no playwright install --with-deps --only-shell chromium
      # Real Google Maps (T2) on next only: fork PRs get no secrets, and every map is billed.
      # Without the key the Maps tests would only skip, so a missing secret fails instead.
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        env:
          VITE_MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: test -n "$VITE_MAPS_KEY" || { echo "::error::the MAPS_KEY secret is not set"; exit 1; }
      - run: npm test
        env:
          VITE_MAPS_KEY: ${{ github.ref == 'refs/heads/next' && !github.event.repository.fork && secrets.MAPS_KEY || '' }}
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: sonar-${{ runner.os }}-
      - if: github.ref == 'refs/heads/next' && !github.event.repository.fork
        continue-on-error: true
        run: npm run sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
