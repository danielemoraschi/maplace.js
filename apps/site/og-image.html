<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maplace.js: the Open Graph image</title>
    <!--
      The site's sharing image, in the home page's look (W66, W85): its hero on map water lit from its top right, the
      headline set as the home page sets it, the examples' table tilted at the right, the night band
      at its foot; its colours and type are the `hero-water`, `band-dark` and `headline` utilities'
      (`src/styles/utilities.css`), written out. Drawn by `node scripts/og-image.ts` into
      `src/assets/og-image.png`.
    -->
    <style>
      @font-face {
        font-family: "Bricolage Grotesque Variable";
        font-weight: 200 800;
        font-stretch: 75% 100%;
        src: url("../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wdth-normal.woff2");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 400 700;
        src: url("../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2");
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        position: relative; width: 1200px; height: 630px; overflow: hidden;
        background: linear-gradient(215deg, #f7fafb 20%, #cfe3ea 75%) #cfe3ea; color: #1b2430;
        font-family: "Instrument Sans", sans-serif;
      }
      .name {
        position: absolute; top: 48px; left: 64px; display: flex; align-items: center; gap: 14px;
        font: 700 34px/1 "Instrument Sans", sans-serif; letter-spacing: -0.01em;
      }
      .name img { width: 40px; height: 40px; }
      h1 {
        position: absolute; top: 130px; left: 64px; width: 640px; margin: 0;
        font: 750 66px/1.02 "Bricolage Grotesque Variable", sans-serif;
        font-stretch: 86%; letter-spacing: -0.035em;
      }
      p {
        position: absolute; top: 362px; left: 64px; width: 600px; margin: 0;
        font-size: 25px; line-height: 1.4; color: #566270;
      }
      .table {
        position: absolute; top: 40px; left: 700px; width: 760px;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
        transform: perspective(1600px) rotateX(38deg) rotateZ(-26deg) translate(-40px, 30px);
        transform-origin: top left;
      }
      .table img {
        display: block; width: 100%; aspect-ratio: 8 / 5; object-fit: cover;
        border: 1px solid rgb(27 36 48 / 0.15); border-radius: 10px;
        box-shadow: 0 18px 30px -18px rgb(27 36 48 / 0.45);
      }
      footer {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 76px; padding: 0 64px;
        display: flex; align-items: center; justify-content: space-between;
        background: #121a22; color: #e6ecf0; font-size: 26px; font-weight: 500;
      }
      footer span:last-child { color: #9aa8b4; }
    </style>
  </head>
  <body>
    <div class="table" aria-hidden="true">
      <img src="src/assets/shots/thumbnails/big.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/whats-on.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/trade-lanes.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/share-by-country.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/popups.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/flights.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/audience.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/circles.jpg" alt="" />
      <img src="src/assets/shots/thumbnails/side-list.jpg" alt="" />
    </div>
    <div class="name"><img src="src/assets/favicon.svg" alt="" />Maplace.js</div>
    <h1>A JavaScript library for markers on Google Maps and MapLibre.</h1>
    <p>Your locations on a map, and the list that goes with them, in sync.</p>
    <footer><span>maplacejs.com</span><span>One script tag · npm · React</span></footer>
  </body>
</html>
