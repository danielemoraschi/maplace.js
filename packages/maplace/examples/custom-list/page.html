<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- A list view of your own: a radio per listed location and one to fit them all, defined by
     name and placed on the map as Maplace.js's own lists are. -->
<style>
  #custom-list-map fieldset { border: 0; padding: 0; }
  #custom-list-map fieldset label { display: inline-block; margin-right: 0.75rem; }
</style>
<maplace-map id="custom-list-map" api-key="YOUR_KEY" list="checks" list-position="top-right"
  list-heading="Choose a location:">
  <maplace-location location-id="london" lat="51.5074" lng="-0.1278" title="London"></maplace-location>
  <maplace-location location-id="york" lat="53.9591" lng="-1.0815" title="York"></maplace-location>
  <maplace-location location-id="bath" lat="51.3811" lng="-2.359" title="Bath"></maplace-location>
  <maplace-location location-id="oxford" lat="51.752" lng="-1.2577" title="Oxford"></maplace-location>
  <maplace-location location-id="cambridge" lat="52.2053" lng="0.1218" title="Cambridge" listed="false"></maplace-location>
</maplace-map>
<script>
  Maplace.defineListView('checks', (maplace, { options, listed }) => {
    const fieldset = document.createElement('fieldset');
    const legend = document.createElement('legend');
    legend.textContent = options.heading ?? 'Locations';
    const choices = document.createElement('div');
    fieldset.append(legend, choices);

    /** A radio choosing `id`, or fitting every location when `id` is empty. */
    function choice(id, title) {
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'custom-list-choice';
      radio.value = id;
      radio.addEventListener('change', () => {
        maplace.select(id || undefined);
        if (!id) maplace.fitAll();
      });
      const label = document.createElement('label');
      label.append(radio, ` ${title}`);
      return label;
    }

    // The choices are made again when the listed locations change; the selection is checked.
    let listedIds;
    function render() {
      const locations = listed();
      const ids = locations.map(({ id }) => id).join();
      if (ids !== listedIds) {
        listedIds = ids;
        choices.replaceChildren(choice('', 'Fit all'), ...locations.map(({ id, title }) => choice(id, title ?? id)));
      }
      const selected = maplace.getSnapshot().selectedId ?? '';
      for (const radio of choices.querySelectorAll('input')) radio.checked = radio.value === selected;
    }

    render();
    const unsubscribe = maplace.subscribe(render);
    return { element: fieldset, destroy: () => { unsubscribe(); fieldset.remove(); } };
  });
</script>
