<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace's store and Google adapter, which adds Maps JS with your key, with a list of your own on it. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #custom-list-script-map { height: 24rem; }
  #custom-list-script-map fieldset { border: 0; padding: 0; }
  #custom-list-script-map fieldset label { display: inline-block; margin-right: 0.75rem; }
</style>
<div id="custom-list-script-map"></div>
<script type="module">
  const locations = [
    { id: "london", lat: 51.5074, lng: -0.1278, title: "London" },
    { id: "york", lat: 53.9591, lng: -1.0815, title: "York" },
    { id: "bath", lat: 51.3811, lng: -2.359, title: "Bath" },
    { id: "oxford", lat: 51.752, lng: -1.2577, title: "Oxford" },
    { id: "cambridge", lat: 52.2053, lng: 0.1218, title: "Cambridge", listed: false },
  ];

  /** A radio choosing `id`, or fitting every location when `id` is empty. */
  function choice(maplace, id, title) {
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "custom-list-script-choice";
    radio.value = id;
    radio.addEventListener("change", () => {
      maplace.select(id || undefined);
      if (!id) maplace.fitAll();
    });
    const label = document.createElement("label");
    label.append(radio, ` ${title}`);
    return label;
  }

  /**
   * A list of your own: a radio per location maplace's lists would list, and one to fit them all.
   * The choices are made again when those change; the selection is checked.
   */
  function checksMenu(maplace, heading) {
    const fieldset = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = heading;
    const choices = document.createElement("div");
    fieldset.append(legend, choices);
    let listedIds;
    const render = () => {
      const listed = Maplace.listedLocations(maplace.getSnapshot());
      const ids = listed.map(({ id }) => id).join();
      if (ids !== listedIds) {
        listedIds = ids;
        const entries = listed.map(({ id, title }) => choice(maplace, id, title ?? id));
        choices.replaceChildren(choice(maplace, "", "Fit all"), ...entries);
      }
      const selected = maplace.getSnapshot().selectedId ?? "";
      for (const radio of choices.querySelectorAll("input"))
        radio.checked = radio.value === selected;
    };
    render();
    maplace.subscribe(render);
    return fieldset;
  }

  const maplace = Maplace.createMaplace({ locations });
  const adapter = Maplace.createGoogleAdapter({ apiKey: "YOUR_KEY" });
  maplace.attach(adapter, "#custom-list-script-map");
  adapter.mountControl(checksMenu(maplace, "Choose a location:"), "top-right");
</script>
