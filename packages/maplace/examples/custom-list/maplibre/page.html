<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- A list view of your own: a radio per listed location and one to fit them all, defined by
     name and placed on the map as maplace's own lists are. -->
<style>
  #custom-list-maplibre-map fieldset { border: 0; padding: 0; }
  #custom-list-maplibre-map fieldset label { display: inline-block; margin-right: 0.75rem; }
</style>
<maplace-map id="custom-list-maplibre-map" list="maplibre-checks" list-position="top-right"
  list-heading="Choose a location:">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan"></maplace-location>
  <maplace-location location-id="naples" lat="40.8518" lng="14.2681" title="Naples"></maplace-location>
  <maplace-location location-id="turin" lat="45.0703" lng="7.6869" title="Turin"></maplace-location>
  <maplace-location location-id="venice" lat="45.4408" lng="12.3155" title="Venice" listed="false"></maplace-location>
</maplace-map>
<script>
  Maplace.defineListView('maplibre-checks', (maplace, { options, listed }) => {
    const fieldset = document.createElement('fieldset');
    const legend = document.createElement('legend');
    legend.textContent = options.heading ?? 'Locations';
    const choices = document.createElement('div');
    fieldset.append(legend, choices);

    /** A radio choosing `id`, or fitting every location when `id` is empty. */
    function choice(id, title) {
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'custom-list-maplibre-choice';
      radio.value = id;
      radio.addEventListener('change', () => {
        maplace.select(id || undefined);
        if (!id) maplace.fitAll();
      });
      const label = document.createElement('label');
      label.append(radio, ` ${title}`);
      return label;
    }

    // The choices are made again when the listed locations change; the selection is checked.
    let listedIds;
    function render() {
      const locations = listed();
      const ids = locations.map(({ id }) => id).join();
      if (ids !== listedIds) {
        listedIds = ids;
        choices.replaceChildren(choice('', 'Fit all'), ...locations.map(({ id, title }) => choice(id, title ?? id)));
      }
      const selected = maplace.getSnapshot().selectedId ?? '';
      for (const radio of choices.querySelectorAll('input')) radio.checked = radio.value === selected;
    }

    render();
    const unsubscribe = maplace.subscribe(render);
    return { element: fieldset, destroy: () => { unsubscribe(); fieldset.remove(); } };
  });
</script>
