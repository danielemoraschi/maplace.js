<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, what the map and its list mount on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #mixed-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #mixed-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #mixed-maplibre-script-list { display: contents; }
  #mixed-maplibre-script-list [role="listbox"] { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #mixed-maplibre-script-map-and-list { flex-direction: column; }
    #mixed-maplibre-script-list [role="listbox"] { flex: none; max-height: 40%; }
  }
</style>
<div id="mixed-maplibre-script-map-and-list">
  <div id="mixed-maplibre-script-map"></div>
  <div id="mixed-maplibre-script-list"></div>
</div>
<script type="module">
  const locations = [
    { id: "tower-of-london", type: "marker", title: "Tower of London", lat: 51.5081, lng: -0.0759 },
    {
      id: "greenwich",
      type: "circle",
      title: "Greenwich",
      center: { lat: 51.4769, lng: -0.0005 },
      radius: 500,
    },
    {
      id: "hyde-park",
      type: "polygon",
      title: "Hyde Park",
      path: [
        { lat: 51.5115, lng: -0.1755 },
        { lat: 51.511, lng: -0.16 },
        { lat: 51.503, lng: -0.16 },
        { lat: 51.5035, lng: -0.1755 },
      ],
    },
    {
      id: "thames",
      type: "polyline",
      title: "Along the Thames",
      path: [
        { lat: 51.5009, lng: -0.1222 },
        { lat: 51.5085, lng: -0.1166 },
        { lat: 51.5098, lng: -0.1043 },
        { lat: 51.5085, lng: -0.0943 },
        { lat: 51.5079, lng: -0.0877 },
      ],
    },
  ];
  Maplace.createMapLibreMap("#mixed-maplibre-script-map", {
    locations,
    list: { container: "#mixed-maplibre-script-list" },
  });
</script>
