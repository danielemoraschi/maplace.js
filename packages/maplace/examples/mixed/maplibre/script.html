<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, the group buttons and what the map and its list mount on, and the map made with Maplace; its data sets come from mixed-a.json to mixed-e.json. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #mixed-maplibre-script-groups [aria-pressed="true"] { background: CanvasText; color: Canvas; }
  #mixed-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #mixed-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #mixed-maplibre-script-list { display: contents; }
  #mixed-maplibre-script-list [role="listbox"] { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #mixed-maplibre-script-map-and-list { flex-direction: column; }
    #mixed-maplibre-script-list [role="listbox"] { flex: none; max-height: 40%; }
  }
</style>
<p id="mixed-maplibre-script-groups">
  <button type="button" value="a">Group A</button>
  <button type="button" value="b">Group B</button>
  <button type="button" value="c">Group C</button>
  <button type="button" value="d">Group D</button>
  <button type="button" value="e">Group E</button>
</p>
<div id="mixed-maplibre-script-map-and-list">
  <div id="mixed-maplibre-script-map"></div>
  <div id="mixed-maplibre-script-list"></div>
</div>
<script type="module">
  const maplace = Maplace.createMapLibreMap("#mixed-maplibre-script-map", {
    list: { container: "#mixed-maplibre-script-list" },
  });

  let latestGroup;

  const buttons = document.querySelectorAll("#mixed-maplibre-script-groups button");
  for (const button of buttons) {
    button.addEventListener("click", () => showGroup(button.value));
  }
  await showGroup("a");

  /**
   * One of the data sets swapped in. Only the group last asked for: a slower answer to an earlier
   * click is dropped.
   */
  async function showGroup(letter) {
    latestGroup = letter;
    for (const button of buttons)
      button.setAttribute("aria-pressed", String(button.value === letter));
    const response = await fetch(`/mixed-${letter}.json`);
    const locations = await response.json();
    if (letter !== latestGroup) return;
    maplace.setLocations(locations);
    maplace.fitAll();
  }
</script>
