<!doctype html>
<!-- The page react.tsx renders into: what the module mounts on, and the module, which brings maplibre-gl and its stylesheet. -->
<style>
  #mixed-maplibre-react-root [aria-pressed="true"] { background: CanvasText; color: Canvas; }
  #mixed-maplibre-react-root .map-and-list { display: flex; height: 24rem; }
  #mixed-maplibre-react-root .map { flex: 1 1 auto; min-width: 0; }
  #mixed-maplibre-react-root [role="listbox"] { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #mixed-maplibre-react-root .map-and-list { flex-direction: column; }
    #mixed-maplibre-react-root [role="listbox"] { flex: none; max-height: 40%; }
  }
</style>
<div id="mixed-maplibre-react-root"></div>
<script type="module" src="./react.tsx"></script>
