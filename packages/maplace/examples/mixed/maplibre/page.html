<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- Four data sets, each fetched by the page and swapped in live: markers, an area and a circle.
     MapLibre has no routing, so the Google version's fifth, a route, isn't here. -->
<style>
  #mixed-maplibre-groups [aria-pressed="true"] { background: CanvasText; color: Canvas; }
</style>
<p id="mixed-maplibre-groups">
  <button type="button" value="a">Markers</button>
  <button type="button" value="b">More markers</button>
  <button type="button" value="d">Area</button>
  <button type="button" value="e">Circle</button>
</p>
<maplace-map id="mixed-maplibre-map" list></maplace-map>
<script type="module">
  const map = document.getElementById('mixed-maplibre-map');
  const buttons = document.querySelectorAll('#mixed-maplibre-groups button');
  let latestGroup;

  /** Swaps in the group last asked for: a slower answer to an earlier click is dropped. */
  async function showGroup(letter) {
    latestGroup = letter;
    for (const button of buttons) button.setAttribute('aria-pressed', String(button.value === letter));
    const response = await fetch(`/mixed-${letter}.json`);
    const locations = await response.json();
    if (letter !== latestGroup) return;
    map.locations = locations;
    map.maplace.fitAll();
  }

  for (const button of buttons) {
    button.addEventListener('click', () => showGroup(button.value));
  }
  await showGroup('a');
</script>
