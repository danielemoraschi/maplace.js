<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- Markers and circles together, data loaded by the page. -->
<maplace-map id="map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" list="list"></maplace-map>
<script>
  fetch('/locations.json')
    .then((response) => response.json())
    .then((locations) => { document.getElementById('map').locations = locations; });
</script>
