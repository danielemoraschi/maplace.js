<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- The address says which place is selected: a link opens on it, and back steps through what was picked; "View all" takes it out. The line under the map gives the link to what is picked. -->
<maplace-map id="link-to-place-maplibre-map" list fit-all fit-all-label="View all" url-state="place-maplibre">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan"></maplace-location>
  <maplace-location location-id="naples" lat="40.8518" lng="14.2681" title="Naples"></maplace-location>
  <maplace-location location-id="turin" lat="45.0703" lng="7.6869" title="Turin"></maplace-location>
</maplace-map>
<p id="link-to-place-maplibre-link"></p>
<script>
  const linkToPlaceMapLibreMap = document.getElementById('link-to-place-maplibre-map');

  /** The line under the map: a link opening on the place `id`, on this map, or a prompt for one. */
  function linkToPlaceMapLibreShowLink(id) {
    const line = document.getElementById('link-to-place-maplibre-link');
    if (id === undefined) {
      line.textContent = 'Pick a place for a link to it.';
      return;
    }
    const address = new URL(location.href);
    address.searchParams.set('place-maplibre', id);
    address.hash = 'link-to-place-maplibre-map';
    const link = document.createElement('a');
    link.href = address.href;
    link.textContent = address.search;
    line.replaceChildren('Link to this place: ', link);
  }

  linkToPlaceMapLibreShowLink(linkToPlaceMapLibreMap.maplace.getSnapshot().selectedId);
  linkToPlaceMapLibreMap.addEventListener('maplace-selectionchange', (event) => linkToPlaceMapLibreShowLink(event.detail.id));
</script>
