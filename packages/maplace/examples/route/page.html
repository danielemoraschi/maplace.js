<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- One route through your own locations, in order. -->
<maplace-map id="route-map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" list>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan"></maplace-location>
  <maplace-location location-id="bologna" lat="44.4949" lng="11.3426" title="Bologna"></maplace-location>
  <maplace-location location-id="florence" lat="43.7696" lng="11.2558" title="Florence"></maplace-location>
</maplace-map>
<output id="route-distance"></output>
<script>
  const routeMap = document.getElementById('route-map');
  routeMap.route = { stops: ['milan', 'bologna', 'florence'], travelMode: 'driving' };
  routeMap.addEventListener('maplace-routechange', (event) => {
    const meters = event.detail.result?.distanceMeters;
    document.getElementById('route-distance').textContent = meters === undefined ? '' : `${Math.round(meters / 1000)} km`;
  });
</script>
