<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- One route through your own locations, passing through Zurich, with directions from its steps. -->
<maplace-map id="route-map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" list>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan"></maplace-location>
  <maplace-location location-id="zurich" lat="47.3769" lng="8.5417" title="Zurich"></maplace-location>
  <maplace-location location-id="paris" lat="48.8566" lng="2.3522" title="Paris"></maplace-location>
  <maplace-location location-id="munich" lat="48.1351" lng="11.582" title="Munich"></maplace-location>
</maplace-map>
<div id="route-directions"></div>
<p>Total: <output id="route-distance"></output></p>
<script>
  const routeMap = document.getElementById('route-map');
  routeMap.route = { stops: ['milan', 'zurich', 'paris', 'munich'], via: ['zurich'], travelMode: 'driving' };

  function routeKm(meters) {
    return `${Math.round(meters / 1000)} km`;
  }

  function routeTitleOf(id) {
    return routeMap.locations.find((location) => location.id === id)?.title ?? id;
  }

  /** A leg's steps, headed by where it runs and how far; a step without words shows its distance. */
  function routeLegDirections(leg) {
    const heading = document.createElement('h3');
    heading.textContent = `${routeTitleOf(leg.from)} → ${routeTitleOf(leg.to)}, ${routeKm(leg.distanceMeters)}`;
    const steps = document.createElement('ol');
    for (const step of leg.steps) {
      const item = document.createElement('li');
      item.textContent = step.instruction ?? `${(step.distanceMeters / 1000).toFixed(1)} km`;
      steps.append(item);
    }
    return [heading, steps];
  }

  routeMap.addEventListener('maplace-routechange', (event) => {
    const result = event.detail.result;
    document.getElementById('route-directions').replaceChildren(...(result?.legs.flatMap(routeLegDirections) ?? []));
    document.getElementById('route-distance').textContent = result ? routeKm(result.distanceMeters) : '';
  });
</script>
