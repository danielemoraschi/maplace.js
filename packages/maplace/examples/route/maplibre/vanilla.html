<!doctype html>
<!-- The page vanilla.ts runs on: what the map, its list, the directions and the total mount on, and the module, which brings maplibre-gl and its stylesheet. -->
<style>
  #route-maplibre-vanilla-map-and-list { display: flex; height: 24rem; }
  #route-maplibre-vanilla-map { flex: 1 1 auto; min-width: 0; }
  #route-maplibre-vanilla-list { display: contents; }
  #route-maplibre-vanilla-list [role="listbox"] { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #route-maplibre-vanilla-map-and-list { flex-direction: column; }
    #route-maplibre-vanilla-list [role="listbox"] { flex: none; max-height: 40%; }
  }
  /* The directions in a panel of their own, below the map: its legs' headings stay in view as
     their steps scroll, and a shade at the bottom shows there is more, gone at the end. */
  #route-maplibre-vanilla-directions:empty { display: none; }
  #route-maplibre-vanilla-directions {
    margin-top: 1rem; max-height: 18rem; overflow: auto; padding: 0 1.25rem 0.5rem;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 0.5rem;
    background:
      linear-gradient(transparent, Canvas 70%) bottom / 100% 1.5rem no-repeat local,
      linear-gradient(transparent, color-mix(in srgb, currentColor 8%, transparent)) bottom / 100% 0.75rem no-repeat,
      Canvas;
  }
  #route-maplibre-vanilla-directions h3 {
    position: sticky; top: 0; margin: 0; padding: 0.75rem 0 0.5rem; background: Canvas;
    border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
  }
  #route-maplibre-vanilla-directions ol { margin: 0.5rem 0 1rem; line-height: 1.6; }
</style>
<div id="route-maplibre-vanilla-map-and-list">
  <div id="route-maplibre-vanilla-map"></div>
  <div id="route-maplibre-vanilla-list"></div>
</div>
<div id="route-maplibre-vanilla-directions"></div>
<p>Total: <output id="route-maplibre-vanilla-distance"></output></p>
<script type="module" src="./vanilla.ts"></script>
