<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- Markers drawn by your CSS: each pin is your own markup (a <template data-icon>), which maplace
     marks data-hovered while the reader points at it and data-selected once they pick it, so your
     CSS gives each state its look. The pin is drawn anew for each state, so the pop is an animation,
     which starts on a new node, not a transition. -->
<style>
  #css-markers-map .pin {
    display: inline-block;
    padding: 0.25rem 0.625rem;
    border: 2px solid #1d1d1b;
    border-radius: 999px;
    background: #fff;
    color: #1d1d1b;
    font: 600 0.8125rem/1.2 system-ui, sans-serif;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgb(0 0 0 / 30%);
    cursor: pointer;
  }
  #css-markers-map .pin[data-hovered] { transform: translateY(-3px); }
  #css-markers-map .pin[data-selected] {
    border-color: #c62828;
    background: #c62828;
    color: #fff;
    transform: scale(1.15);
  }
  @media (prefers-reduced-motion: no-preference) {
    #css-markers-map .pin[data-selected] { animation: css-markers-pop 0.3s ease-out; }
  }
  @keyframes css-markers-pop { from { transform: scale(0.85); } }
</style>
<maplace-map id="css-markers-map" api-key="YOUR_KEY">
  <maplace-location location-id="rijks" lat="52.36" lng="4.8852" title="Rijksmuseum">
    <template data-icon><span class="pin">Rijks</span></template>
  </maplace-location>
  <maplace-location location-id="anne-frank" lat="52.3752" lng="4.884" title="Anne Frank House">
    <template data-icon><span class="pin">Anne Frank</span></template>
  </maplace-location>
  <maplace-location location-id="hermitage" lat="52.3654" lng="4.9025" title="Hermitage">
    <template data-icon><span class="pin">Hermitage</span></template>
  </maplace-location>
  <maplace-location location-id="nemo" lat="52.3738" lng="4.9123" title="NEMO Science Museum">
    <template data-icon><span class="pin">NEMO</span></template>
  </maplace-location>
  <maplace-location location-id="eye" lat="52.3843" lng="4.9008" title="Eye Filmmuseum">
    <template data-icon><span class="pin">Eye</span></template>
  </maplace-location>
</maplace-map>
