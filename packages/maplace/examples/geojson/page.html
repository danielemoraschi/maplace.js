<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  /* On a phone the list goes under the map, its half staying that size. */
  @media (width < 40rem) {
    #geojson-map { height: 36rem; }
    #geojson-map > .maplace-list-view { flex: 0 0 50%; max-height: 50%; }
  }
</style>
<!-- A GeoJSON file as the map's layer: the park an area, its avenue a line, its places markers, each feature's about property in the popup a click opens. -->
<maplace-map id="geojson-map" api-key="YOUR_KEY" list></maplace-map>
<script type="module">
  const response = await fetch("/examples/data/regents-park.json");
  document.getElementById("geojson-map").locations = Maplace.locationsFromGeoJSON(await response.json()).map(
    (feature) => ({ ...feature, content: feature.data?.about }),
  );
</script>
