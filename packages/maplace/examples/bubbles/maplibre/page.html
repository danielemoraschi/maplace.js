<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- The world's largest cities as bubbles, each as big as its population, the list beside
     it, which "This area" narrows to the map's view, and under the map the legend's sizes and a
     count of what it shows. The populations are rounded, for the example. -->
<!-- This example's look lives in the examples' styles/bubbles.css, which every version links. -->
<link rel="stylesheet" href="../../styles/bubbles.css">
<style>
  /* On a phone the list goes under the map, its half staying that size. */
  @media (width < 40rem) {
    #bubbles-maplibre-map { height: 36rem; }
    #bubbles-maplibre-map > .maplace-list-view { flex: 0 0 50%; max-height: 50%; }
  }
</style>
<maplace-map id="bubbles-maplibre-map" list="maplibre-bubbles-cities" list-heading="Cities" list-scope="viewport"></maplace-map>
<p class="bubbles-legend" id="bubbles-maplibre-legend">Population</p>
<p>Now in view <output id="bubbles-maplibre-in-view">–</output></p>
<script>
  // The list's entries, the page's own: a view defined as the page is read, so the map finds
  // it when it opens; the module below gives the map its cities.
  {
    const compact = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
    // A city in the list: its name, then its population.
    const cityEntry = ({ location }) => {
      const entry = document.createElement("span");
      entry.className = "bubbles-city";
      const population = document.createElement("span");
      population.className = "bubbles-population";
      population.textContent = compact.format(location.data.population);
      entry.append(location.title, population);
      return entry;
    };
    Maplace.defineListView("maplibre-bubbles-cities", (maplace, { options }) =>
      Maplace.createListView(maplace, { ...options, render: cityEntry }));
  }
</script>
<script type="module">
  // Tokyo's 37M, the largest city in the file, is 56px across; a bubble's area is its population.
  const LARGEST = 37e6;
  const compact = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
  // A circle as big as a population, none under 6px across.
  const bubble = (population) => {
    const circle = document.createElement("span");
    circle.className = "bubble";
    const diameter = Math.max(6, Math.sqrt(population / LARGEST) * 56);
    circle.style.width = circle.style.height = `${diameter}px`;
    return circle;
  };
  // Whether a city is inside the bounds, which may cross the antimeridian (west > east).
  const inView = ({ lat, lng }, { north, south, east, west }) => {
    const inLongitude = west <= east ? lng >= west && lng <= east : lng >= west || lng <= east;
    return lat >= south && lat <= north && inLongitude;
  };
  // How many cities, and how many people in them: "12 cities · 210M people".
  const summaryOf = (cities) => {
    const people = cities.reduce((sum, { data }) => sum + data.population, 0);
    return `${cities.length} cities · ${compact.format(people)} people`;
  };

  const { maplace } = document.getElementById("bubbles-maplibre-map");
  maplace.fitAll({ padding: 32 });

  // The legend's sizes, drawn as the bubbles are.
  for (const population of [30e6, 10e6, 3e6]) {
    const size = document.createElement("span");
    size.className = "bubbles-size";
    const circle = bubble(population);
    circle.setAttribute("aria-hidden", "true");
    size.append(circle, compact.format(population));
    document.getElementById("bubbles-maplibre-legend").append(size);
  }

  // The file lists the largest first, so the small bubbles are drawn over the big ones.
  const cities = await fetch("/examples/data/cities.json").then((response) => response.json());
  maplace.setLocations(cities.map((city) => ({ ...city, icon: () => bubble(city.data.population) })));

  // What the map shows: now, if it has settled while the file loaded, then after each move.
  const inViewNow = document.getElementById("bubbles-maplibre-in-view");
  const showInView = (bounds) => {
    if (bounds) inViewNow.value = summaryOf(cities.filter((city) => inView(city, bounds)));
  };
  showInView(maplace.getSnapshot().viewport?.bounds);
  maplace.on("viewportChange", ({ viewport }) => showInView(viewport.bounds));
</script>
