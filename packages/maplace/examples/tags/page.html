<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- Places with several tags, in a list on the map under their one group; the checkboxes show those with all the ticked tags. -->
<p id="tags-filters">
  <label><input type="checkbox" value="parking" /> Parking</label>
  <label><input type="checkbox" value="open-late" /> Open late</label>
</p>
<maplace-map id="tags-map" api-key="YOUR_KEY" list list-position="top-right" list-heading="Places">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome" group="Centre" tags="parking open-late"></maplace-location>
  <maplace-location location-id="bologna" lat="44.4949" lng="11.3426" title="Bologna" group="Centre"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan" group="North" tags="parking"></maplace-location>
  <maplace-location location-id="turin" lat="45.0703" lng="7.6869" title="Turin" group="North" tags="open-late"></maplace-location>
  <maplace-location location-id="naples" lat="40.8518" lng="14.2681" title="Naples" group="South" tags="parking open-late"></maplace-location>
</maplace-map>
<script>
  document.getElementById('tags-filters').addEventListener('change', (event) => {
    const ticked = event.currentTarget.querySelectorAll(':checked');
    document.getElementById('tags-map').maplace.setFilter({ tags: Array.from(ticked, (box) => box.value) });
  });
</script>
