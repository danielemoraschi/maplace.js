<!doctype html>
<!-- A page of your own script: the CDN script, the checkboxes and what the map mounts on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #tags-script-map { height: 24rem; }
</style>
<p id="tags-script-filters">
  <label><input type="checkbox" value="parking" /> Parking</label>
  <label><input type="checkbox" value="open-late" /> Open late</label>
</p>
<div id="tags-script-map"></div>
<script type="module">
  const maplace = Maplace.createGoogleMap("#tags-script-map", {
    apiKey: "YOUR_KEY",
    locations: [
      { id: "rome", lat: 41.9028, lng: 12.4964, title: "Rome", group: "Centre", tags: ["parking", "open-late"] },
      { id: "bologna", lat: 44.4949, lng: 11.3426, title: "Bologna", group: "Centre" },
      { id: "milan", lat: 45.4642, lng: 9.19, title: "Milan", group: "North", tags: ["parking"] },
      { id: "turin", lat: 45.0703, lng: 7.6869, title: "Turin", group: "North", tags: ["open-late"] },
      { id: "naples", lat: 40.8518, lng: 14.2681, title: "Naples", group: "South", tags: ["parking", "open-late"] },
    ],
    list: { heading: "Places" },
  });

  const filters = document.querySelector("#tags-script-filters");
  filters?.addEventListener("change", () => {
    const ticked = filters.querySelectorAll(":checked");
    maplace.setFilter({ tags: Array.from(ticked, (box) => box.value) });
  });
</script>
