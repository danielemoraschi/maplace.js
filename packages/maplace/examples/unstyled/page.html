<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- No default styles: data-maplace-unstyled turns Maplace.js's own off inside the map (its height,
     the list's layout and looks, the popups' text), and nothing takes their place: the map and its
     list as your page shows them, with no CSS of yours but the map's height. -->
<style>
  /* The one rule the map needs: with Maplace.js's defaults off, it has no height of its own. */
  #unstyled-map .maplace-map-pane { height: 24rem; }
</style>
<maplace-map id="unstyled-map" api-key="YOUR_KEY" list data-maplace-unstyled>
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome">
    <template><p>Capital of Italy.</p></template>
  </maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan">
    <template><p>Finance and fashion.</p></template>
  </maplace-location>
  <maplace-location location-id="naples" lat="40.8518" lng="14.2681" title="Naples">
    <template><p>Pizza's home town.</p></template>
  </maplace-location>
  <maplace-location location-id="venice" lat="45.4408" lng="12.3155" title="Venice">
    <template><p>Built on water.</p></template>
  </maplace-location>
</maplace-map>
