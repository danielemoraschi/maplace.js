<!doctype html>
<!-- A page of your own script: the CDN script, what the map and its list mount on, inside data-maplace-unstyled, and the map made with Maplace, which adds Maps JS with your key; the page's CSS draws the map, the list and the popups' text. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #unstyled-script-map-and-list {
    display: grid;
    grid-template-columns: 1fr 12rem;
    gap: 0 1.5rem;
    height: 24rem;
    font: 1rem/1.4 Georgia, serif;
  }
  #unstyled-script-map { min-width: 0; }
  #unstyled-script-list { display: contents; }
  #unstyled-script-map-and-list .maplace-listbox { margin: 0; padding: 0; overflow-y: auto; }
  #unstyled-script-map-and-list .maplace-option { padding: 0.375rem 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; }
  #unstyled-script-map-and-list .maplace-option[data-hovered] { text-decoration-color: #e4322b; }
  #unstyled-script-map-and-list .maplace-option[data-selected] { font-weight: 700; text-decoration-thickness: 0.15em; }
  #unstyled-script-map-and-list .maplace-popup, #unstyled-script-map-and-list .maplace-popup-heading { color: #1d1d1b; font: 1rem/1.4 Georgia, serif; }
  #unstyled-script-map-and-list .maplace-popup-heading { display: block; font-weight: 700; }
  #unstyled-script-map-and-list .maplace-popup p { margin: 0; }
  /* Google's bubble without maplace's inset: the text kept off its edges. */
  #unstyled-script-map-and-list .maplace-popup { padding: 0 0.75rem 0.75rem 0; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #unstyled-script-map-and-list { grid-template-columns: 1fr; grid-template-rows: 1fr auto; height: 30rem; }
  }
</style>
<div id="unstyled-script-map-and-list" data-maplace-unstyled>
  <div id="unstyled-script-map"></div>
  <div id="unstyled-script-list"></div>
</div>
<script type="module">
  const locations = [
    { id: "rome", lat: 41.9028, lng: 12.4964, title: "Rome", content: () => popupOf("Capital of Italy.") },
    { id: "milan", lat: 45.4642, lng: 9.19, title: "Milan", content: () => popupOf("Finance and fashion.") },
    { id: "naples", lat: 40.8518, lng: 14.2681, title: "Naples", content: () => popupOf("Pizza's home town.") },
    { id: "venice", lat: 45.4408, lng: 12.3155, title: "Venice", content: () => popupOf("Built on water.") },
  ];

  Maplace.createGoogleMap("#unstyled-script-map", {
    apiKey: "YOUR_KEY",
    locations,
    list: { container: "#unstyled-script-list" },
  });

  /** A popup's content: a line about the place, under its title (the popup's heading). */
  function popupOf(about) {
    const text = document.createElement("p");
    text.textContent = about;
    return text;
  }
</script>
