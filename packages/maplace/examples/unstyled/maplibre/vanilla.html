<!doctype html>
<!-- The page vanilla.ts runs on: what the module mounts on, and the module, which brings maplibre-gl and its stylesheet. -->
<style>
  #unstyled-maplibre-vanilla-map-and-list {
    display: grid;
    grid-template-columns: 1fr 12rem;
    gap: 0 1.5rem;
    height: 24rem;
    font: 1rem/1.4 Georgia, serif;
  }
  #unstyled-maplibre-vanilla-map { min-width: 0; }
  #unstyled-maplibre-vanilla-list { display: contents; }
  #unstyled-maplibre-vanilla-map-and-list .maplace-listbox { margin: 0; padding: 0; overflow-y: auto; }
  #unstyled-maplibre-vanilla-map-and-list .maplace-option { padding: 0.375rem 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; }
  #unstyled-maplibre-vanilla-map-and-list .maplace-option[data-hovered] { text-decoration-color: #e4322b; }
  #unstyled-maplibre-vanilla-map-and-list .maplace-option[data-selected] { font-weight: 700; text-decoration-thickness: 0.15em; }
  #unstyled-maplibre-vanilla-map-and-list .maplace-popup, #unstyled-maplibre-vanilla-map-and-list .maplace-popup-heading { color: #1d1d1b; font: 1rem/1.4 Georgia, serif; }
  /* MapLibre's heading without maplace's room: kept clear of the close button. */
  #unstyled-maplibre-vanilla-map-and-list .maplace-popup-heading { display: block; font-weight: 700; margin-right: 1.25rem; }
  #unstyled-maplibre-vanilla-map-and-list .maplace-popup p { margin: 0; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #unstyled-maplibre-vanilla-map-and-list { grid-template-columns: 1fr; grid-template-rows: 1fr auto; height: 30rem; }
  }
</style>
<div id="unstyled-maplibre-vanilla-map-and-list" data-maplace-unstyled>
  <div id="unstyled-maplibre-vanilla-map"></div>
  <div id="unstyled-maplibre-vanilla-list"></div>
</div>
<script type="module" src="./vanilla.ts"></script>
