<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-cluster.iife.js"></script>
<!-- Clustered points from a JSON file, which the element loads from src (the cluster build bundles @googlemaps/markerclusterer): the markers near each other drawn as one badge counting them, which splits as you zoom in. -->
<maplace-map id="big-map" api-key="YOUR_KEY" cluster src="/examples/data/points-4k.json"></maplace-map>
