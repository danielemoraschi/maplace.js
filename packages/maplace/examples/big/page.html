<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-cluster.iife.js"></script>
<!-- 4,000 points, clustered (the cluster build bundles @googlemaps/markerclusterer), and a list on the map that follows it: "This area only" lists what is in view, "Show all" everything again. -->
<maplace-map id="big-map" api-key="YOUR_KEY" cluster list list-position="top-right" list-scope="viewport"></maplace-map>
<script type="module">
  const response = await fetch('/points-4k.json');
  document.getElementById('big-map').locations = await response.json();
</script>
