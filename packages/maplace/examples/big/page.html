<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-cluster.iife.js"></script>
<!-- 4,000 points, clustered: the cluster build bundles @googlemaps/markerclusterer. -->
<maplace-map id="map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" cluster></maplace-map>
<script>
  fetch('/points-4k.json')
    .then((response) => response.json())
    .then((locations) => { document.getElementById('map').locations = locations; });
</script>
