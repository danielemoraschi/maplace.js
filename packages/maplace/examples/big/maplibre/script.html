<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl, its stylesheet and its clustering, what the map mounts on, and the map made with Maplace; its 4,000 points come from points-4k.json, and its list on the map follows it: its switch lists "All" or "This area", what is in view as the map moves. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #big-maplibre-script-map { height: 24rem; }
</style>
<div id="big-maplibre-script-map"></div>
<script type="module">
  const maplace = Maplace.createMapLibreMap("#big-maplibre-script-map", {
    cluster: true,
    list: { scope: "viewport" },
  });

  const response = await fetch("/points-4k.json");
  const points = await response.json();
  maplace.setLocations(points);
</script>
