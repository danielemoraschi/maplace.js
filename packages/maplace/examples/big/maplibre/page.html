<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- 4,000 points, clustered (the MapLibre build bundles its clustering): the markers near each other drawn as one badge counting them, which splits as you zoom in. -->
<maplace-map id="big-maplibre-map" cluster></maplace-map>
<script type="module">
  const response = await fetch('/points-4k.json');
  document.getElementById('big-maplibre-map').locations = await response.json();
</script>
