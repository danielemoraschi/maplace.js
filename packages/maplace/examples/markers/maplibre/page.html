<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #markers-maplibre-map .star {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #f5b301;
    color: #111;
    font-size: 1.125rem;
    box-shadow: 0 1px 4px rgb(0 0 0 / 35%);
  }
</style>
<!-- Three image icons, a DOM icon the page's CSS styles, and Edinburgh's own zoom when it is selected. -->
<maplace-map id="markers-maplibre-map">
  <maplace-location location-id="london" lat="51.5074" lng="-0.1278" title="London" icon="/examples/data/icons/a.svg"></maplace-location>
  <maplace-location location-id="edinburgh" lat="55.9533" lng="-3.1883" title="Edinburgh" icon="/examples/data/icons/b.svg" zoom="8"></maplace-location>
  <maplace-location location-id="manchester" lat="53.4808" lng="-2.2426" title="Manchester" icon="/examples/data/icons/c.svg"></maplace-location>
  <maplace-location location-id="cardiff" lat="51.4816" lng="-3.1791" title="Cardiff">
    <template data-icon><span class="star">★</span></template>
  </maplace-location>
</maplace-map>
