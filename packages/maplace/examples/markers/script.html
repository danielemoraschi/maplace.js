<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #markers-script-map { height: 24rem; }
  #markers-script-map .star {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #f5b301;
    color: #111;
    font-size: 1.125rem;
    box-shadow: 0 1px 4px rgb(0 0 0 / 35%);
  }
</style>
<div id="markers-script-map"></div>
<script type="module">
  const star = document.createElement("span");
  star.className = "star";
  star.textContent = "★";

  Maplace.createGoogleMap("#markers-script-map", {
    apiKey: "YOUR_KEY",
    locations: [
      { id: "rome", lat: 41.9028, lng: 12.4964, title: "Rome", icon: "/icons/a.svg" },
      { id: "milan", lat: 45.4642, lng: 9.19, title: "Milan", icon: "/icons/b.svg", zoom: 8 },
      { id: "naples", lat: 40.8518, lng: 14.2681, title: "Naples", icon: "/icons/c.svg" },
      { id: "venice", lat: 45.4408, lng: 12.3155, title: "Venice", icon: star },
    ],
  });
</script>
