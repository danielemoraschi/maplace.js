<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #markers-script-map { height: 24rem; }
  #markers-script-map .star {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #f5b301;
    color: #111;
    font-size: 1.125rem;
    box-shadow: 0 1px 4px rgb(0 0 0 / 35%);
  }
</style>
<div id="markers-script-map"></div>
<script type="module">
  const star = document.createElement("span");
  star.className = "star";
  star.textContent = "★";

  Maplace.createGoogleMap("#markers-script-map", {
    apiKey: "YOUR_KEY",
    locations: [
      { id: "london", lat: 51.5074, lng: -0.1278, title: "London", icon: "/icons/a.svg" },
      { id: "edinburgh", lat: 55.9533, lng: -3.1883, title: "Edinburgh", icon: "/icons/b.svg", zoom: 8 },
      { id: "manchester", lat: 53.4808, lng: -2.2426, title: "Manchester", icon: "/icons/c.svg" },
      { id: "cardiff", lat: 51.4816, lng: -3.1791, title: "Cardiff", icon: star },
    ],
  });
</script>
