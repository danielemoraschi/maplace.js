<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace, which adds Maps JS with your key; its image icons are served from /icons/. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #markers-script-map { height: 24rem; }
  #markers-script-map .star {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #f5b301;
    color: #fff;
    font-size: 1.125rem;
    box-shadow: 0 1px 4px rgb(0 0 0 / 35%);
  }
</style>
<div id="markers-script-map"></div>
<script type="module">
  const star = document.createElement("span");
  star.className = "star";
  star.textContent = "★";

  const locations = [
    {
      id: "rome",
      lat: 41.9028,
      lng: 12.4964,
      title: "Rome",
      icon: "/icons/a.svg",
      content: () => popupOf("Capital of Italy."),
    },
    {
      id: "milan",
      lat: 45.4642,
      lng: 9.19,
      title: "Milan",
      icon: "/icons/b.svg",
      zoom: 8,
      content: () => popupOf("Finance and fashion."),
    },
    { id: "naples", lat: 40.8518, lng: 14.2681, title: "Naples", icon: "/icons/c.svg" },
    { id: "venice", lat: 45.4408, lng: 12.3155, title: "Venice", icon: star },
    { id: "florence", lat: 43.7696, lng: 11.2558, title: "Florence", listed: false },
  ];

  const maplace = Maplace.createGoogleMap("#markers-script-map", {
    apiKey: "YOUR_KEY",
    locations,
    list: { heading: "Choose a location:" },
  });

  maplace.on("mapClick", ({ position }) => dropMarkerAt(position));

  let dropped = 0;
  /** A click on the map drops a marker there. */
  function dropMarkerAt(position) {
    dropped += 1;
    const marker = { id: `dropped-${dropped}`, ...position, title: `Dropped pin ${dropped}` };
    maplace.setLocations([...maplace.getSnapshot().locations, marker]);
  }

  /** A popup's content: a line about the place, under its title (the popup's heading). */
  function popupOf(about) {
    const text = document.createElement("p");
    text.textContent = about;
    return text;
  }
</script>
