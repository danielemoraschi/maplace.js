<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- Image icons, a DOM icon, popups (Naples has none), Milan's own zoom, Florence on the map only,
     the list on the map under a heading, and a click on the map dropping a marker there. -->
<maplace-map id="markers-map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" list list-position="top-right"
  list-heading="Choose a location:">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome" icon="/icons/a.svg">
    <template><strong>Rome</strong><p>Capital of Italy.</p></template>
  </maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan" icon="/icons/b.svg" zoom="8">
    <template><strong>Milan</strong><p>Finance and fashion.</p></template>
  </maplace-location>
  <maplace-location location-id="naples" lat="40.8518" lng="14.2681" title="Naples" icon="/icons/c.svg"></maplace-location>
  <maplace-location location-id="venice" lat="45.4408" lng="12.3155" title="Venice">
    <template data-icon><span>★</span></template>
  </maplace-location>
  <maplace-location location-id="florence" lat="43.7696" lng="11.2558" title="Florence" listed="false"></maplace-location>
</maplace-map>
<script>
  let markersDropped = 0;
  document.getElementById('markers-map').addEventListener('maplace-mapclick', (event) => {
    markersDropped += 1;
    const marker = document.createElement('maplace-location');
    marker.setAttribute('location-id', `dropped-${markersDropped}`);
    marker.setAttribute('lat', event.detail.position.lat);
    marker.setAttribute('lng', event.detail.position.lng);
    marker.setAttribute('title', `Dropped pin ${markersDropped}`);
    event.currentTarget.append(marker);
  });
</script>
