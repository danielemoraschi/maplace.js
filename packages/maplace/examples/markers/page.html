<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #markers-map .star {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #f5b301;
    color: #111;
    font-size: 1.125rem;
    box-shadow: 0 1px 4px rgb(0 0 0 / 35%);
  }
</style>
<!-- Three image icons, a DOM icon the page's CSS styles, and Milan's own zoom when it is selected. -->
<maplace-map id="markers-map" api-key="YOUR_KEY">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome" icon="/icons/a.svg"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan" icon="/icons/b.svg" zoom="8"></maplace-location>
  <maplace-location location-id="naples" lat="40.8518" lng="14.2681" title="Naples" icon="/icons/c.svg"></maplace-location>
  <maplace-location location-id="venice" lat="45.4408" lng="12.3155" title="Venice">
    <template data-icon><span class="star">★</span></template>
  </maplace-location>
</maplace-map>
