<script>
  {
    const map = document.getElementById("team-maplibre-map");
    const viewerZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    // How long until the next minute begins, and a little past it, so the clock reads the new one.
    const untilNextMinute = () => 60_050 - (Date.now() % 60_000);

    // The time on a zone's clock: "17:30".
    const localTimeOf = (timeZone, now) =>
      new Intl.DateTimeFormat("en-GB", { timeZone, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(now);
    // How far a zone's clock is ahead of UTC, in minutes: Kolkata's 330 ("GMT" alone is 0).
    const minutesFromUtc = (timeZone, now) => {
      const name = new Intl.DateTimeFormat("en-GB", { timeZone, timeZoneName: "longOffset" })
        .formatToParts(now).find(({ type }) => type === "timeZoneName")?.value ?? "";
      const [, sign = "+", hours = "0", minutes = "0"] = /GMT([+\-−])(\d\d):(\d\d)/.exec(name) ?? [];
      return (sign === "+" ? 1 : -1) * (Number(hours) * 60 + Number(minutes));
    };
    // "+5h30", "−8h" or "same time": how far a zone's clock is ahead of yours, or behind.
    const offsetFromYou = (timeZone, now) => {
      const minutes = minutesFromUtc(timeZone, now) - minutesFromUtc(viewerZone, now);
      if (minutes === 0) return "same time";
      const sign = minutes > 0 ? "+" : "−";
      const hours = Math.floor(Math.abs(minutes) / 60);
      const rest = Math.abs(minutes) % 60;
      return `${sign}${hours}h${rest ? String(rest).padStart(2, "0") : ""}`;
    };
    const writeLocalTime = (time) => {
      const now = new Date();
      time.textContent = `${localTimeOf(time.dataset.timeZone, now)} · ${offsetFromYou(time.dataset.timeZone, now)}`;
    };
    // A span showing the time on a zone's clock beside how far it is from yours.
    const localTime = (timeZone) => {
      const time = document.createElement("span");
      time.className = "team-member-time";
      time.dataset.timeZone = timeZone;
      writeLocalTime(time);
      return time;
    };
    const span = (className, ...children) => {
      const element = document.createElement("span");
      element.className = className;
      element.append(...children);
      return element;
    };

    // A person's entry in the list, the page's own: their face (their location's own icon), name,
    // role and city from their <maplace-location>'s data- attributes, and the time where they are.
    const memberItem = ({ location }) => {
      const person = map.querySelector(`maplace-location[location-id="${CSS.escape(location.id)}"]`).dataset;
      const face = location.icon(location, { selected: false, hovered: false });
      face.setAttribute("aria-hidden", "true");
      return span("team-member", face, span("team-member-text",
        span("team-member-name", location.title),
        span("team-member-detail", `${person.role} · ${person.city}`),
        localTime(person.timeZone)));
    };
    Maplace.defineListView("maplibre-team-members", (maplace, { options }) =>
      Maplace.createListView(maplace, { ...options, render: memberItem }));

    // Every time shown turns as each minute begins.
    const showLocalTimes = () => {
      for (const time of map.querySelectorAll(".team-member-time")) writeLocalTime(time);
      setTimeout(showLocalTimes, untilNextMinute());
    };
    setTimeout(showLocalTimes, untilNextMinute());
  }
</script>
