<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, what the map and its list mount on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- This example's look lives in the examples' styles/share-by-country.css, which every version links. -->
<link rel="stylesheet" href="../../styles/share-by-country.css">
<style>
  #share-by-country-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #share-by-country-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #share-by-country-maplibre-script-list { display: contents; }
  #share-by-country-maplibre-script-list .maplace-list-view { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, its half staying that size. */
  @media (width < 40rem) {
    #share-by-country-maplibre-script-map-and-list { flex-direction: column; height: 36rem; }
    #share-by-country-maplibre-script-list .maplace-list-view { flex: 0 0 50%; max-height: 50%; }
  }
</style>
<div id="share-by-country-maplibre-script-map-and-list">
  <div id="share-by-country-maplibre-script-map"></div>
  <div id="share-by-country-maplibre-script-list"></div>
</div>
<script type="module">
  const span = (className, ...children) => {
    const element = document.createElement("span");
    element.className = className;
    element.append(...children);
    return element;
  };
  // A country in the list: its name with its colour's swatch and its share, then ten dots, the share filled in.
  const shareEntry = ({ location }) => {
    const { share, colour } = location.data;
    const dots = span("share-dots");
    dots.setAttribute("aria-hidden", "true");
    for (let tenth = 0; tenth < 10; tenth++) {
      const dot = span("share-dot");
      dot.toggleAttribute("data-filled", tenth < share / 10);
      dots.append(dot);
    }
    const entry = span("share-entry", span("share-head", span("share-name", location.title), span("share-figure", `${share}%`)), dots);
    entry.style.setProperty("--colour", colour);
    return entry;
  };
  // A country's share on the map: the figure in a ring of its colour.
  const badgeIcon = ({ data }) => {
    const badge = span("share-badge", `${data.share}%`);
    badge.style.setProperty("--colour", data.colour);
    return badge;
  };

  const maplace = Maplace.createMapLibreMap("#share-by-country-maplibre-script-map", {
    view: { kind: "fit-all", padding: 48 },
    list: { container: "#share-by-country-maplibre-script-list", heading: "Share by country", fitAll: true, fitAllLabel: "All countries", render: shareEntry },
  });

  // Each country's share, the colour it is drawn in, and where its badge sits. The shares are
  // made up, for the example.
  const shares = [
    { id: "USA", share: 30, colour: "#1d4ed8", badge: { lat: 33, lng: -98 } },
    { id: "IND", share: 20, colour: "#c2410c", badge: { lat: 16, lng: 78 } },
    { id: "GBR", share: 20, colour: "#15803d", badge: { lat: 51, lng: -1.5 } },
    { id: "BRA", share: 10, colour: "#6d28d9", badge: { lat: -16, lng: -52 } },
    { id: "SAU", share: 10, colour: "#b45309", badge: { lat: 19, lng: 45 } },
    { id: "AUS", share: 10, colour: "#be185d", badge: { lat: -31, lng: 134 } },
  ];
  const countries = Maplace.locationsFromGeoJSON(await fetch("/examples/data/countries.json").then((response) => response.json()));

  // Each country in its colour, then its badge: in the shares' order, so the list is too.
  const locations = shares.flatMap(({ id, share, colour, badge }) => {
    const country = countries.find((location) => location.id === id);
    if (country === undefined) throw new Error(`countries.json has no ${id} to shade`);
    const data = { share, colour };
    return [
      {
        ...country,
        data,
        style: { fill: colour, fillOpacity: 0.85, stroke: "#ffffff", strokeWidth: 1 },
        hoveredStyle: { fillOpacity: 1 },
        selectedStyle: { fillOpacity: 1, stroke: "#111827", strokeWidth: 2 },
      },
      { id: `${id}-badge`, title: `${country.title}: ${share}%`, ...badge, listed: false, data, icon: badgeIcon },
    ];
  });
  maplace.setLocations(locations);

  // A click on a badge selects its country, as a click on its entry does.
  maplace.on("selectionChange", ({ id }) => {
    if (id?.endsWith("-badge")) maplace.select(id.replace(/-badge$/, ""));
  });
</script>
