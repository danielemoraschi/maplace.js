<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- A trail to edit (drag a point, or the middle of a segment), Cinque Terre's coastal path, with
     the villages along it and a list beside the map under a heading, all from inline JSON. -->
<maplace-map list list-heading="Along the trail">
  <script type="application/json">
    [{ "id": "trail", "type": "polyline", "title": "Sentiero Azzurro", "editable": true,
       "path": [{ "lat": 44.0996, "lng": 9.7377 }, { "lat": 44.1066, "lng": 9.7285 }, { "lat": 44.1197, "lng": 9.7103 },
                { "lat": 44.1348, "lng": 9.6847 }, { "lat": 44.1462, "lng": 9.6548 }] },
     { "id": "manarola", "lat": 44.1066, "lng": 9.7285, "title": "Manarola", "content": "Its harbour, and the houses above it." },
     { "id": "corniglia", "lat": 44.1197, "lng": 9.7103, "title": "Corniglia", "content": "The village on the cliff top." },
     { "id": "vernazza", "lat": 44.1348, "lng": 9.6847, "title": "Vernazza", "content": "A harbour and its castle's tower." }]
  </script>
</maplace-map>
