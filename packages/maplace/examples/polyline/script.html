<!doctype html>
<!-- A page of your own script: the CDN script, what the map and its list mount on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #polyline-script-map-and-list { display: flex; height: 24rem; }
  #polyline-script-map { flex: 1 1 auto; min-width: 0; }
  #polyline-script-list { display: contents; }
  #polyline-script-list .maplace-list-view { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #polyline-script-map-and-list { flex-direction: column; }
    #polyline-script-list .maplace-list-view { flex: none; max-height: 40%; }
  }
</style>
<div id="polyline-script-map-and-list">
  <div id="polyline-script-map"></div>
  <div id="polyline-script-list"></div>
</div>
<script type="module">
  // Cinque Terre's coastal path, Riomaggiore to Monterosso, through the villages between.
  const path = [
    { lat: 44.0996, lng: 9.7377 },
    { lat: 44.1066, lng: 9.7285 },
    { lat: 44.1197, lng: 9.7103 },
    { lat: 44.1348, lng: 9.6847 },
    { lat: 44.1462, lng: 9.6548 },
  ];
  const locations = [
    // Editable: drag a point, or the middle of a segment.
    { id: "trail", type: "polyline", title: "Sentiero Azzurro", editable: true, path },
    {
      id: "manarola",
      lat: 44.1066,
      lng: 9.7285,
      title: "Manarola",
      content: "Its harbour, and the houses above it.",
    },
    {
      id: "corniglia",
      lat: 44.1197,
      lng: 9.7103,
      title: "Corniglia",
      content: "The village on the cliff top.",
    },
    {
      id: "vernazza",
      lat: 44.1348,
      lng: 9.6847,
      title: "Vernazza",
      content: "A harbour and its castle's tower.",
    },
  ];
  Maplace.createGoogleMap("#polyline-script-map", {
    apiKey: "YOUR_KEY",
    locations,
    list: { container: "#polyline-script-list", heading: "Along the trail" },
  });
</script>
