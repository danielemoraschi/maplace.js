<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-cluster.iife.js"></script>
<!-- One palette across the map: the delivery areas' colours at rest, hovered and selected, the
     cluster badge's (--maplace-cluster-background, --maplace-cluster-color), and the list's,
     through the classes maplace's markup carries. -->
<style>
  #brand-map { --maplace-cluster-background: #3b2416; --maplace-cluster-color: #f5ead9; }
  #brand-map .maplace-option[data-hovered] { background: #f5ead9; color: #3b2416; }
  #brand-map .maplace-option[data-selected] { background: #23735a; color: #fff; }
</style>
