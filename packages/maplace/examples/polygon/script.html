<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #polygon-script-map { height: 24rem; }
</style>
<div id="polygon-script-map"></div>
<script type="module">
  // save(location): your own code, writing an edited location back to your server.

  const locations = [
    {
      id: "park",
      type: "polygon",
      title: "Hyde Park",
      editable: true,
      path: [
        { lat: 51.512, lng: -0.175 },
        { lat: 51.513, lng: -0.16 },
        { lat: 51.503, lng: -0.155 },
      ],
    },
  ];
  const maplace = Maplace.createGoogleMap("#polygon-script-map", { apiKey: "YOUR_KEY", locations });
  maplace.on("locationChange", ({ location }) => save(location));
</script>
