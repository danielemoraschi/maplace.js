<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- Google's own look: a light or dark map, or the reader's system scheme, and Google's map options
     (here the map-type control). Choosing a scheme opens the map again in it, where it was.
     A map's Cloud styling hangs on its map ID: put your own in map-id. -->
<p><label for="styled-scheme">Map style</label> <select id="styled-scheme" autocomplete="off">
  <option value="light">Light</option>
  <option value="dark">Dark</option>
  <option value="follow-system">Follow the system</option>
</select></p>
<maplace-map id="styled-map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" color-scheme="light"
  map-options='{"mapTypeControl":true}'>
  <maplace-location location-id="lisbon" lat="38.7223" lng="-9.1393" title="Lisbon"></maplace-location>
  <maplace-location location-id="porto" lat="41.1579" lng="-8.6291" title="Porto"></maplace-location>
  <maplace-location location-id="coimbra" lat="40.2033" lng="-8.4103" title="Coimbra"></maplace-location>
  <maplace-location location-id="faro" lat="37.0194" lng="-7.9304" title="Faro"></maplace-location>
</maplace-map>
<script>
  document.getElementById('styled-scheme').addEventListener('change', (event) => {
    document.getElementById('styled-map').setAttribute('color-scheme', event.currentTarget.value);
  });
</script>
