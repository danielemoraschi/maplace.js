<!doctype html>
<!-- A page of your own script: the CDN script, the theme button and what the map mounts on, and the map made with Maplace's store and Google adapter, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #styled-script-map { height: 24rem; }
</style>
<p><button type="button" id="styled-script-scheme">Dark theme</button></p>
<div id="styled-script-map"></div>
<script type="module">
  const locations = [
    { id: "lisbon", lat: 38.7223, lng: -9.1393, title: "Lisbon" },
    { id: "porto", lat: 41.1579, lng: -8.6291, title: "Porto" },
    { id: "coimbra", lat: 40.2033, lng: -8.4103, title: "Coimbra" },
    { id: "faro", lat: 37.0194, lng: -7.9304, title: "Faro" },
  ];

  /**
   * Google's own look: a light or dark map, with the map-type control. A map's Cloud styling hangs
   * on its map ID: put your own in `mapId`.
   */
  const adapterIn = (colorScheme) =>
    Maplace.createGoogleAdapter({
      apiKey: "YOUR_KEY",
      mapId: "DEMO_MAP_ID",
      colorScheme,
      mapOptions: { mapTypeControl: true },
    });

  const maplace = Maplace.createMaplace({ locations });
  let dark = false;
  let detach = maplace.attach(adapterIn("light"), "#styled-script-map");

  // A map's colour scheme is set when it opens: the button opens a new one where this one was,
  // and names the scheme it switches to.
  const schemeButton = document.querySelector("#styled-script-scheme");
  schemeButton?.addEventListener("click", () => {
    dark = !dark;
    schemeButton.textContent = dark ? "Light theme" : "Dark theme";
    const { viewport } = maplace.getSnapshot();
    detach();
    if (viewport) maplace.setView(viewport.center, viewport.zoom);
    detach = maplace.attach(adapterIn(dark ? "dark" : "light"), "#styled-script-map");
  });
</script>
