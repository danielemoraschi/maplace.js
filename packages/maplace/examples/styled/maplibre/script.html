<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, the style select and what the map mounts on, and the map made with Maplace's store and MapLibre adapter. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #styled-maplibre-script-map { height: 24rem; }
</style>
<p><label for="styled-maplibre-script-style">Map style</label> <select id="styled-maplibre-script-style" autocomplete="off">
  <option value="https://tiles.openfreemap.org/styles/bright">Bright</option>
  <option value="https://tiles.openfreemap.org/styles/liberty">Liberty</option>
  <option value="https://tiles.openfreemap.org/styles/positron">Positron</option>
  <option value="https://tiles.openfreemap.org/styles/dark">Dark</option>
</select></p>
<div id="styled-maplibre-script-map"></div>
<script type="module">
  const locations = [
    { id: "lisbon", lat: 38.7223, lng: -9.1393, title: "Lisbon" },
    { id: "porto", lat: 41.1579, lng: -8.6291, title: "Porto" },
    { id: "coimbra", lat: 40.2033, lng: -8.4103, title: "Coimbra" },
    { id: "faro", lat: 37.0194, lng: -7.9304, title: "Faro" },
  ];

  /**
   * MapLibre's own look: a style, here one of OpenFreeMap's the page offers (any style URL works:
   * MapTiler's, Stadia's, your own), with a compact attribution.
   */
  const adapterIn = (mapStyle) =>
    Maplace.createMapLibreAdapter({
      mapStyle,
      mapOptions: { attributionControl: { compact: true } },
    });

  const maplace = Maplace.createMaplace({ locations });
  const styleSelect = document.querySelector("#styled-maplibre-script-style");
  let detach = maplace.attach(adapterIn(styleSelect.value), "#styled-maplibre-script-map");

  // A map's style is set when it opens: choosing one opens a new map where this one was.
  styleSelect.addEventListener("change", () => {
    const { viewport } = maplace.getSnapshot();
    detach();
    if (viewport) maplace.setView(viewport.center, viewport.zoom);
    detach = maplace.attach(adapterIn(styleSelect.value), "#styled-maplibre-script-map");
  });
</script>
