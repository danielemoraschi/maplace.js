<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- MapLibre's own look: a style, here one of OpenFreeMap's, and MapLibre's map options (here a
     compact attribution). Choosing a style opens the map again in it, where it was. Any style URL
     works in map-style: MapTiler's, Stadia's, your own. -->
<p><label for="styled-maplibre-style">Map style</label> <select id="styled-maplibre-style" autocomplete="off">
  <option value="https://tiles.openfreemap.org/styles/bright">Bright</option>
  <option value="https://tiles.openfreemap.org/styles/liberty">Liberty</option>
  <option value="https://tiles.openfreemap.org/styles/positron">Positron</option>
  <option value="https://tiles.openfreemap.org/styles/dark">Dark</option>
</select></p>
<maplace-map id="styled-maplibre-map" map-style="https://tiles.openfreemap.org/styles/bright"
  map-options='{"attributionControl":{"compact":true}}'>
  <maplace-location location-id="lisbon" lat="38.7223" lng="-9.1393" title="Lisbon"></maplace-location>
  <maplace-location location-id="porto" lat="41.1579" lng="-8.6291" title="Porto"></maplace-location>
  <maplace-location location-id="coimbra" lat="40.2033" lng="-8.4103" title="Coimbra"></maplace-location>
  <maplace-location location-id="faro" lat="37.0194" lng="-7.9304" title="Faro"></maplace-location>
</maplace-map>
<script>
  document.getElementById('styled-maplibre-style').addEventListener('change', (event) => {
    document.getElementById('styled-maplibre-map').setAttribute('map-style', event.currentTarget.value);
  });
</script>
