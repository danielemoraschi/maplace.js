<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace's store and adapter, which adds Maps JS with your key, without its map-type, Street View and camera controls; a count and a legend of your own on it, in maplace's panel made nothing. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  /* The frame: a dark page of its own around a rounded map and, beside it, a card. */
  #whats-on-script-frame { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; border-radius: 16px; background: #1c1d21; }
  #whats-on-script-map { flex: 3 1 22rem; min-width: 0; height: 26rem; border-radius: 12px; overflow: hidden; }
  /* Each category's colour, which its pins and its chip take. */
  #whats-on-script-frame [data-category="Theatre"] { --category: #e4572e; }
  #whats-on-script-frame [data-category="Concerts"] { --category: #8e44ad; }
  #whats-on-script-frame [data-category="Markets"] { --category: #2a9d8f; }
  #whats-on-script-frame [data-category="Talks"] { --category: #c48a00; }
  #whats-on-script-frame .pin {
    display: block;
    box-sizing: border-box;
    width: 22px;
    height: 22px;
    border: 3px solid #fff;
    border-radius: 50%;
    background: var(--category);
    box-shadow: 0 1px 4px rgb(0 0 0 / 40%);
    cursor: pointer;
  }
  #whats-on-script-frame .pin[data-hovered] { transform: translateY(-2px); }
  #whats-on-script-frame .pin[data-selected] { transform: scale(1.25); box-shadow: 0 0 0 2px var(--category), 0 2px 6px rgb(0 0 0 / 45%); }
  /* maplace's panel on the map, made nothing, so the count and the legend are the page's own. */
  #whats-on-script-frame .maplace-control { padding: 0; background: none; box-shadow: none; }
  #whats-on-script-frame .event-count, #whats-on-script-frame .event-selected, #whats-on-script-frame .event-legend {
    background: rgb(28 29 33 / 88%);
    color: #f2f2f3;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  #whats-on-script-frame .event-count { padding: 8px 14px; border-radius: 999px; }
  #whats-on-script-frame .event-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #whats-on-script-frame .event-selected { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; }
  #whats-on-script-frame .event-selected::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-script-frame .event-selected[hidden] { display: none; }
  #whats-on-script-frame .event-legend { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; margin: 0; padding: 4px; border: 0; border-radius: 18px; }
  /* On a phone, the four chips two by two rather than three and one. */
  @media (width < 30rem) {
    #whats-on-script-frame .event-legend { display: grid; grid-template-columns: 1fr 1fr; }
  }
  #whats-on-script-frame .category-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #whats-on-script-frame .category-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-script-frame .category-chip:hover { background: rgb(255 255 255 / 12%); }
  #whats-on-script-frame .category-chip[aria-pressed="true"] { background: #f2f2f3; color: #1c1d21; }
  #whats-on-script-frame .category-chip:focus-visible { outline: 2px solid #f2f2f3; outline-offset: 2px; }
  /* The card beside the map, under it where there is no room: the venue selected, or a word
     asking for one. */
  #whats-on-script-frame .venue-card {
    flex: 1 1 14rem;
    box-sizing: border-box;
    padding: 16px 18px;
    border-radius: 12px;
    background: #26272c;
    color: #f2f2f3;
    font: 400 14px/1.4 system-ui, sans-serif;
  }
  #whats-on-script-frame .venue-empty { margin: 0; color: #a5a6ad; }
  #whats-on-script-frame .venue { padding-left: 12px; border-left: 3px solid var(--category); }
  #whats-on-script-frame .venue-category { display: flex; align-items: center; gap: 6px; margin: 0; color: #c9cad0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  #whats-on-script-frame .venue-category::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-script-frame .venue-name { margin: 6px 0 14px; font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1.2; }
  #whats-on-script-frame .venue dl { display: grid; gap: 12px; margin: 0; }
  #whats-on-script-frame .venue dt { color: #a5a6ad; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  #whats-on-script-frame .venue dd { margin: 2px 0 0; }
</style>
<div id="whats-on-script-frame">
  <div id="whats-on-script-map"></div>
  <aside id="whats-on-script-card" class="venue-card" aria-label="Venue">
    <p class="venue-empty">Pick a venue on the map to see it here.</p>
    <template>
      <div class="venue">
        <p class="venue-category"></p>
        <h3 class="venue-name">Venue</h3>
        <dl>
          <div><dt>Address</dt><dd class="venue-address"></dd></div>
          <div><dt>Since</dt><dd class="venue-since"></dd></div>
          <div><dt>Known for</dt><dd class="venue-known-for"></dd></div>
        </dl>
      </div>
    </template>
  </aside>
</div>
<script type="module">
  const locations = [
    venue("national-theatre", 51.507, -0.1145, "National Theatre", "Theatre", {
      address: "Upper Ground, London SE1 9PX",
      since: 1976,
      knownFor: "Three stages on the South Bank",
    }),
    venue("globe", 51.5081, -0.0972, "Shakespeare's Globe", "Theatre", {
      address: "21 New Globe Walk, London SE1 9DT",
      since: 1997,
      knownFor: "An open-air playhouse rebuilt after the 1599 original",
    }),
    venue("donmar", 51.5136, -0.1254, "Donmar Warehouse", "Theatre", {
      address: "41 Earlham Street, London WC2H 9LX",
      since: 1977,
      knownFor: "A small studio theatre in Covent Garden",
    }),
    venue("royal-albert-hall", 51.501, -0.1774, "Royal Albert Hall", "Concerts", {
      address: "Kensington Gore, London SW7 2AP",
      since: 1871,
      knownFor: "The BBC Proms, every summer",
    }),
    venue("wigmore-hall", 51.5165, -0.149, "Wigmore Hall", "Concerts", {
      address: "36 Wigmore Street, London W1U 2BP",
      since: 1901,
      knownFor: "Chamber music and song recitals",
    }),
    venue("barbican", 51.5202, -0.0938, "Barbican Hall", "Concerts", {
      address: "Silk Street, London EC2Y 8DS",
      since: 1982,
      knownFor: "Home of the London Symphony Orchestra",
    }),
    venue("borough-market", 51.5055, -0.091, "Borough Market", "Markets", {
      address: "8 Southwark Street, London SE1 1TL",
      since: 1756,
      knownFor: "One of London's oldest food markets",
    }),
    venue("camden-market", 51.5413, -0.146, "Camden Market", "Markets", {
      address: "Camden Lock Place, London NW1 8AF",
      since: 1974,
      knownFor: "Stalls along the Regent's Canal",
    }),
    venue("spitalfields", 51.5197, -0.0754, "Old Spitalfields Market", "Markets", {
      address: "16 Horner Square, London E1 6EW",
      since: 1638,
      knownFor: "A Victorian market hall in the East End",
    }),
    venue("british-library", 51.5299, -0.1277, "British Library", "Talks", {
      address: "96 Euston Road, London NW1 2DB",
      since: 1973,
      knownFor: "The UK's national library, at St Pancras",
    }),
    venue("conway-hall", 51.5203, -0.1188, "Conway Hall", "Talks", {
      address: "25 Red Lion Square, London WC1R 4RL",
      since: 1929,
      knownFor: "Talks and debates, home of the Conway Hall Ethical Society",
    }),
    venue("royal-institution", 51.5098, -0.1425, "Royal Institution", "Talks", {
      address: "21 Albemarle Street, London W1S 4BS",
      since: 1799,
      knownFor: "The Christmas Lectures, given since 1825",
    }),
  ];

  /** Every venue fitted, with room at the edges for the count and the legend over the map. */
  const maplace = Maplace.createMaplace({ locations, view: { kind: "fit-all", padding: 80 } });
  const adapter = Maplace.createGoogleAdapter({ apiKey: "YOUR_KEY", mapOptions: { mapTypeControl: false, streetViewControl: false, cameraControl: false } });
  maplace.attach(adapter, "#whats-on-script-map");
  adapter.mountControl(eventLegend(maplace), "bottom-left");
  adapter.mountControl(eventStatus(maplace), "top-left");
  showVenueIn(document.querySelector("#whats-on-script-card"), maplace);

  /** A venue in its category, its pin coloured by it, with what the card says of it. */
  function venue(id, lat, lng, title, group, data) {
    return { id, lat, lng, title, group, data, icon: pinFor(group) };
  }

  /** A pin of your own, its colour the category's (`--category`, by `data-category` in the CSS). */
  function pinFor(category) {
    const pin = document.createElement("span");
    pin.className = "pin";
    pin.dataset.category = category;
    return pin;
  }

  /** The count, and beside it the name of the venue selected, if any. */
  function eventStatus(maplace) {
    const status = document.createElement("div");
    status.className = "event-status";
    status.append(eventCount(maplace), selectedName(maplace));
    return status;
  }

  /** How many venues are shown, of all of them, said again when that changes. */
  function eventCount(maplace) {
    const count = document.createElement("output");
    count.className = "event-count";
    const writeCount = () => {
      const snapshot = maplace.getSnapshot();
      const shown = Maplace.listedLocations(snapshot).length;
      const total = snapshot.locations.length;
      const text = shown === total ? `${total} venues` : `${shown} of ${total} venues`;
      if (count.textContent !== text) count.textContent = text;
    };
    writeCount();
    maplace.subscribe(writeCount);
    return count;
  }

  /**
   * The name of the venue selected, marked with its category for its colour; hidden while none is.
   * Not a live region: maplace says each selection to a screen reader already.
   */
  function selectedName(maplace) {
    const name = document.createElement("span");
    name.className = "event-selected";
    const writeName = (id) => {
      const selected = maplace.getSnapshot().locations.find((location) => location.id === id);
      name.hidden = selected === undefined;
      name.textContent = selected?.title ?? "";
      name.dataset.category = selected?.group ?? "";
    };
    writeName(maplace.getSnapshot().selectedId);
    maplace.on("selectionChange", ({ id }) => writeName(id));
    return name;
  }

  /**
   * The card beside the map: the venue selected, its category marked for its colour, made from the
   * card's template and in the card only while a venue is selected; or a word asking for one. Not a live region: maplace says each selection to a screen reader already.
   */
  function showVenueIn(card, maplace) {
    const empty = card.querySelector(".venue-empty");
    const template = card.querySelector("template");
    const venuePart = template.content.firstElementChild.cloneNode(true);
    const write = (selector, text) => {
      venuePart.querySelector(selector).textContent = text;
    };
    const writeCard = (id) => {
      const selected = maplace.getSnapshot().locations.find((location) => location.id === id);
      const data = selected?.data;
      empty.hidden = data !== undefined;
      if (selected === undefined || data === undefined) {
        venuePart.remove();
        return;
      }
      venuePart.dataset.category = selected.group;
      write(".venue-category", selected.group ?? "");
      write(".venue-name", selected.title ?? "");
      write(".venue-address", data.address);
      write(".venue-since", String(data.since));
      write(".venue-known-for", data.knownFor);
      card.append(venuePart);
    };
    writeCard(maplace.getSnapshot().selectedId);
    maplace.on("selectionChange", ({ id }) => writeCard(id));
  }

  /**
   * A chip per category, in the venues' order; the one shown alone is pressed. The chips are made once,
   * so a chip pressed from the keyboard keeps its focus; a store change only moves the press.
   */
  function eventLegend(maplace) {
    const legend = document.createElement("fieldset");
    legend.className = "event-legend";
    legend.setAttribute("aria-label", "Categories");
    const categories = new Set(maplace.getSnapshot().locations.flatMap(({ group }) => group ?? []));
    const chips = [...categories].map((category) => categoryChip(maplace, category));
    legend.append(...chips);
    let pressed;
    const pressShownAlone = () => {
      const alone = shownAlone(maplace);
      if (alone === pressed) return;
      pressed = alone;
      for (const chip of chips) {
        chip.setAttribute("aria-pressed", String(chip.dataset.category === alone));
      }
    };
    pressShownAlone();
    maplace.subscribe(pressShownAlone);
    return legend;
  }

  /** A toggle showing `category` alone, or every category again once pressed. */
  function categoryChip(maplace, category) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "category-chip";
    chip.dataset.category = category;
    chip.setAttribute("aria-pressed", "false");
    chip.textContent = category;
    chip.addEventListener("click", () => {
      maplace.setFilter(shownAlone(maplace) === category ? undefined : [category]);
    });
    return chip;
  }

  /** The category the map shows alone, if any. */
  function shownAlone(maplace) {
    const groups = maplace.getSnapshot().filter?.groups;
    return groups?.length === 1 ? groups[0] : undefined;
  }
</script>
