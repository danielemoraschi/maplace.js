<!doctype html>
<!-- The page vanilla.ts runs on: what the module mounts on, and the module, which brings maplibre-gl and its stylesheet. -->
<!-- This example's look lives in whats-on.css, one folder up, which every version links. -->
<link rel="stylesheet" href="../whats-on.css">
<div id="whats-on-maplibre-vanilla-frame" class="whats-on">
  <div id="whats-on-maplibre-vanilla-map" class="whats-on-map"></div>
  <aside id="whats-on-maplibre-vanilla-card" class="venue-card" aria-label="Venue">
    <div class="venue-picker">
      <p class="venue-list-category" hidden></p>
      <p class="venue-empty">Pick a venue on the map, or here.</p>
      <ul class="venue-list" aria-label="Venues"></ul>
    </div>
    <template>
      <div class="venue">
        <button type="button" class="venue-close" aria-label="Close"></button>
        <p class="venue-category"></p>
        <h3 class="venue-name">Venue</h3>
        <dl>
          <div><dt>Address</dt><dd class="venue-address"></dd></div>
          <div><dt>Since</dt><dd class="venue-since"></dd></div>
          <div><dt>Known for</dt><dd class="venue-known-for"></dd></div>
        </dl>
      </div>
    </template>
  </aside>
</div>
<script type="module" src="./vanilla.ts"></script>
