<!doctype html>
<!-- The page vanilla.ts runs on: what the module mounts on, and the module, which brings maplibre-gl and its stylesheet. -->
<style>
  /* The frame: a dark page of its own around a rounded map and, beside it, a card. */
  #whats-on-maplibre-vanilla-frame { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; border-radius: 16px; background: #1c1d21; }
  #whats-on-maplibre-vanilla-map { flex: 3 1 22rem; min-width: 0; height: 26rem; border-radius: 12px; overflow: hidden; }
  /* Each category's colour, which its pins and its chip take. */
  #whats-on-maplibre-vanilla-frame [data-category="Theatre"] { --category: #e4572e; }
  #whats-on-maplibre-vanilla-frame [data-category="Concerts"] { --category: #8e44ad; }
  #whats-on-maplibre-vanilla-frame [data-category="Markets"] { --category: #2a9d8f; }
  #whats-on-maplibre-vanilla-frame [data-category="Talks"] { --category: #c48a00; }
  #whats-on-maplibre-vanilla-frame .pin {
    display: block;
    box-sizing: border-box;
    width: 22px;
    height: 22px;
    border: 3px solid #fff;
    border-radius: 50%;
    background: var(--category);
    box-shadow: 0 1px 4px rgb(0 0 0 / 40%);
    cursor: pointer;
  }
  #whats-on-maplibre-vanilla-frame .pin[data-hovered] { transform: translateY(-2px); }
  #whats-on-maplibre-vanilla-frame .pin[data-selected] { transform: scale(1.25); box-shadow: 0 0 0 2px var(--category), 0 2px 6px rgb(0 0 0 / 45%); }
  /* maplace's panel on the map, made nothing, so the count and the legend are the page's own. */
  #whats-on-maplibre-vanilla-frame .maplace-control { padding: 0; background: none; box-shadow: none; }
  #whats-on-maplibre-vanilla-frame .event-count, #whats-on-maplibre-vanilla-frame .event-selected, #whats-on-maplibre-vanilla-frame .event-legend {
    background: rgb(28 29 33 / 88%);
    color: #f2f2f3;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  #whats-on-maplibre-vanilla-frame .event-count { padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-vanilla-frame .event-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #whats-on-maplibre-vanilla-frame .event-selected { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-vanilla-frame .event-selected::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-vanilla-frame .event-selected[hidden] { display: none; }
  #whats-on-maplibre-vanilla-frame .event-legend { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; margin: 0; padding: 4px; border: 0; border-radius: 18px; }
  /* On a phone, the four chips two by two rather than three and one. */
  @media (width < 30rem) {
    #whats-on-maplibre-vanilla-frame .event-legend { display: grid; grid-template-columns: 1fr 1fr; }
  }
  #whats-on-maplibre-vanilla-frame .category-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #whats-on-maplibre-vanilla-frame .category-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-vanilla-frame .category-chip:hover { background: rgb(255 255 255 / 12%); }
  #whats-on-maplibre-vanilla-frame .category-chip[aria-pressed="true"] { background: #f2f2f3; color: #1c1d21; }
  #whats-on-maplibre-vanilla-frame .category-chip:focus-visible { outline: 2px solid #f2f2f3; outline-offset: 2px; }
  /* The card beside the map, under it where there is no room: the venue selected, or the
     venues shown, each picked with a press. */
  #whats-on-maplibre-vanilla-frame .venue-card {
    flex: 1 1 14rem;
    box-sizing: border-box;
    padding: 16px 18px;
    border-radius: 12px;
    background: #26272c;
    color: #f2f2f3;
    font: 400 14px/1.4 system-ui, sans-serif;
  }
  #whats-on-maplibre-vanilla-frame .venue-empty { margin: 0; color: #a5a6ad; }
  #whats-on-maplibre-vanilla-frame .venue-list { display: grid; margin: 8px -8px 0; padding: 0; list-style: none; }
  #whats-on-maplibre-vanilla-frame .venue-pick {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 4px 8px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  #whats-on-maplibre-vanilla-frame .venue-pick::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-vanilla-frame .venue-close {
    position: absolute;
    top: -6px;
    right: -6px;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: #c9cad0;
    cursor: pointer;
  }
  /* The × drawn as two bars crossing at the button's centre, which a glyph's metrics never are. */
  #whats-on-maplibre-vanilla-frame .venue-close::before, #whats-on-maplibre-vanilla-frame .venue-close::after {
    content: "";
    grid-area: 1 / 1;
    width: 14px;
    height: 2px;
    border-radius: 1px;
    background: currentColor;
    transform: rotate(45deg);
  }
  #whats-on-maplibre-vanilla-frame .venue-close::after { transform: rotate(-45deg); }
  #whats-on-maplibre-vanilla-frame .venue-pick:hover, #whats-on-maplibre-vanilla-frame .venue-close:hover { background: rgb(255 255 255 / 8%); }
  #whats-on-maplibre-vanilla-frame .venue-pick:focus-visible, #whats-on-maplibre-vanilla-frame .venue-close:focus-visible { outline: 2px solid #f2f2f3; outline-offset: 2px; }
  #whats-on-maplibre-vanilla-frame .venue { position: relative; padding-left: 12px; border-left: 3px solid var(--category); }
  #whats-on-maplibre-vanilla-frame .venue-category, #whats-on-maplibre-vanilla-frame .venue-list-category { display: flex; align-items: center; gap: 6px; margin: 0; color: #c9cad0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  #whats-on-maplibre-vanilla-frame .venue-category::before, #whats-on-maplibre-vanilla-frame .venue-list-category::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  /* The category shown alone, a tag over the list rather than another of its venues. */
  #whats-on-maplibre-vanilla-frame .venue-list-category { width: fit-content; margin-bottom: 10px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--category) 30%, transparent); color: #f2f2f3; }
  #whats-on-maplibre-vanilla-frame .venue-list-category[hidden] { display: none; }
  #whats-on-maplibre-vanilla-frame .venue-name { margin: 6px 0 14px; font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1.2; }
  #whats-on-maplibre-vanilla-frame .venue dl { display: grid; gap: 12px; margin: 0; }
  #whats-on-maplibre-vanilla-frame .venue dt { color: #a5a6ad; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  #whats-on-maplibre-vanilla-frame .venue dd { margin: 2px 0 0; }
</style>
<div id="whats-on-maplibre-vanilla-frame">
  <div id="whats-on-maplibre-vanilla-map"></div>
  <aside id="whats-on-maplibre-vanilla-card" class="venue-card" aria-label="Venue">
    <div class="venue-picker">
      <p class="venue-list-category" hidden></p>
      <p class="venue-empty">Pick a venue on the map, or here.</p>
      <ul class="venue-list" aria-label="Venues"></ul>
    </div>
    <template>
      <div class="venue">
        <button type="button" class="venue-close" aria-label="Close"></button>
        <p class="venue-category"></p>
        <h3 class="venue-name">Venue</h3>
        <dl>
          <div><dt>Address</dt><dd class="venue-address"></dd></div>
          <div><dt>Since</dt><dd class="venue-since"></dd></div>
          <div><dt>Known for</dt><dd class="venue-known-for"></dd></div>
        </dl>
      </div>
    </template>
  </aside>
</div>
<script type="module" src="./vanilla.ts"></script>
