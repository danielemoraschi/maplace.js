<!doctype html>
<!-- The page vanilla.ts runs on: what the module mounts on, and the module, which brings maplibre-gl and its stylesheet. -->
<style>
  /* The frame: a dark page of its own around a rounded map. */
  #whats-on-maplibre-vanilla-frame { padding: 12px; border-radius: 16px; background: #1c1d21; }
  #whats-on-maplibre-vanilla-map { height: 26rem; border-radius: 12px; overflow: hidden; }
  /* Each category's colour, which its pins and its chip take. */
  #whats-on-maplibre-vanilla-frame [data-category="Theatre"] { --category: #e4572e; }
  #whats-on-maplibre-vanilla-frame [data-category="Concerts"] { --category: #8e44ad; }
  #whats-on-maplibre-vanilla-frame [data-category="Markets"] { --category: #2a9d8f; }
  #whats-on-maplibre-vanilla-frame [data-category="Talks"] { --category: #c48a00; }
  #whats-on-maplibre-vanilla-frame .pin {
    display: block;
    box-sizing: border-box;
    width: 22px;
    height: 22px;
    border: 3px solid #fff;
    border-radius: 50%;
    background: var(--category);
    box-shadow: 0 1px 4px rgb(0 0 0 / 40%);
    cursor: pointer;
  }
  #whats-on-maplibre-vanilla-frame .pin[data-hovered] { transform: translateY(-2px); }
  #whats-on-maplibre-vanilla-frame .pin[data-selected] { transform: scale(1.25); box-shadow: 0 0 0 2px var(--category), 0 2px 6px rgb(0 0 0 / 45%); }
  /* maplace's panel on the map, made nothing, so the count and the legend are the page's own. */
  #whats-on-maplibre-vanilla-frame .maplace-control { padding: 0; background: none; box-shadow: none; }
  #whats-on-maplibre-vanilla-frame .event-count, #whats-on-maplibre-vanilla-frame .event-legend {
    background: rgb(28 29 33 / 88%);
    color: #f2f2f3;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  #whats-on-maplibre-vanilla-frame .event-count { display: block; padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-vanilla-frame .event-legend { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; margin: 0; padding: 4px; border: 0; border-radius: 18px; }
  /* On a phone, the four chips two by two rather than three and one. */
  @media (width < 30rem) {
    #whats-on-maplibre-vanilla-frame .event-legend { display: grid; grid-template-columns: 1fr 1fr; }
  }
  #whats-on-maplibre-vanilla-frame .category-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #whats-on-maplibre-vanilla-frame .category-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-vanilla-frame .category-chip:hover { background: rgb(255 255 255 / 12%); }
  #whats-on-maplibre-vanilla-frame .category-chip[aria-pressed="true"] { background: #f2f2f3; color: #1c1d21; }
  #whats-on-maplibre-vanilla-frame .category-chip:focus-visible { outline: 2px solid #f2f2f3; outline-offset: 2px; }
</style>
<div id="whats-on-maplibre-vanilla-frame">
  <div id="whats-on-maplibre-vanilla-map"></div>
</div>
<script type="module" src="./vanilla.ts"></script>
