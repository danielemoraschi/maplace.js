<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- A look all your own, on OpenFreeMap's liberty style: a dark frame, pins of your markup
     coloured by category, a count over the map's top left and a legend on its bottom left whose
     chips show one category; maplace's panel on the map made nothing. -->
<style>
  /* The frame: a dark page of its own around a rounded map. */
  #whats-on-maplibre-frame { position: relative; padding: 12px; border-radius: 16px; background: #1c1d21; }
  #whats-on-maplibre-map { height: 26rem; border-radius: 12px; overflow: hidden; }
  /* Each category's colour, which its pins and its chip take. */
  #whats-on-maplibre-frame [data-category="Theatre"] { --category: #e4572e; }
  #whats-on-maplibre-frame [data-category="Concerts"] { --category: #8e44ad; }
  #whats-on-maplibre-frame [data-category="Markets"] { --category: #2a9d8f; }
  #whats-on-maplibre-frame [data-category="Talks"] { --category: #c48a00; }
  #whats-on-maplibre-frame .pin {
    display: block;
    box-sizing: border-box;
    width: 22px;
    height: 22px;
    border: 3px solid #fff;
    border-radius: 50%;
    background: var(--category);
    box-shadow: 0 1px 4px rgb(0 0 0 / 40%);
    cursor: pointer;
  }
  #whats-on-maplibre-frame .pin[data-hovered] { transform: translateY(-2px); }
  #whats-on-maplibre-frame .pin[data-selected] { transform: scale(1.25); box-shadow: 0 0 0 2px var(--category), 0 2px 6px rgb(0 0 0 / 45%); }
  /* maplace's panel on the map, made nothing, so the count and the legend are the page's own. */
  #whats-on-maplibre-frame .maplace-control { padding: 0; background: none; box-shadow: none; }
  #whats-on-maplibre-frame .event-count, #whats-on-maplibre-frame .event-selected, #whats-on-maplibre-frame .event-legend {
    background: rgb(28 29 33 / 88%);
    color: #f2f2f3;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  #whats-on-maplibre-frame .event-count { padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-frame .event-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #whats-on-maplibre-frame .event-selected { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-frame .event-selected::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-frame .event-selected[hidden] { display: none; }
  #whats-on-maplibre-frame .event-legend { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; margin: 0; padding: 4px; border: 0; border-radius: 18px; }
  /* On a phone, the four chips two by two rather than three and one. */
  @media (width < 30rem) {
    #whats-on-maplibre-frame .event-legend { display: grid; grid-template-columns: 1fr 1fr; }
  }
  #whats-on-maplibre-frame .category-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #whats-on-maplibre-frame .category-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-frame .category-chip:hover { background: rgb(255 255 255 / 12%); }
  #whats-on-maplibre-frame .category-chip[aria-pressed="true"] { background: #f2f2f3; color: #1c1d21; }
  #whats-on-maplibre-frame .category-chip:focus-visible { outline: 2px solid #f2f2f3; outline-offset: 2px; }
  /* The count over the map's top left, where a control would sit: the element places one view
     of yours on the map, the legend. It takes no clicks, so the map under it still does. */
  #whats-on-maplibre-status { position: absolute; top: 22px; left: 22px; z-index: 1; pointer-events: none; }
  /* Shown with the map only, not over its load or failure panel. */
  #whats-on-maplibre-frame:has(#whats-on-maplibre-map:not(:state(ready))) #whats-on-maplibre-status { display: none; }
</style>
<div id="whats-on-maplibre-frame">
  <div id="whats-on-maplibre-status" class="event-status">
    <output id="whats-on-maplibre-count" class="event-count"></output>
    <span id="whats-on-maplibre-selected" class="event-selected" hidden></span>
  </div>
  <maplace-map id="whats-on-maplibre-map" map-style="https://tiles.openfreemap.org/styles/liberty"
    list="maplibre-whats-on-legend" list-position="bottom-left">
    <maplace-location location-id="national-theatre" lat="51.507" lng="-0.1145" title="National Theatre" group="Theatre">
      <template data-icon><span class="pin" data-category="Theatre"></span></template>
    </maplace-location>
    <maplace-location location-id="globe" lat="51.5081" lng="-0.0972" title="Shakespeare's Globe" group="Theatre">
      <template data-icon><span class="pin" data-category="Theatre"></span></template>
    </maplace-location>
    <maplace-location location-id="donmar" lat="51.5136" lng="-0.1254" title="Donmar Warehouse" group="Theatre">
      <template data-icon><span class="pin" data-category="Theatre"></span></template>
    </maplace-location>
    <maplace-location location-id="royal-albert-hall" lat="51.501" lng="-0.1774" title="Royal Albert Hall" group="Concerts">
      <template data-icon><span class="pin" data-category="Concerts"></span></template>
    </maplace-location>
    <maplace-location location-id="wigmore-hall" lat="51.5165" lng="-0.149" title="Wigmore Hall" group="Concerts">
      <template data-icon><span class="pin" data-category="Concerts"></span></template>
    </maplace-location>
    <maplace-location location-id="barbican" lat="51.5202" lng="-0.0938" title="Barbican Hall" group="Concerts">
      <template data-icon><span class="pin" data-category="Concerts"></span></template>
    </maplace-location>
    <maplace-location location-id="borough-market" lat="51.5055" lng="-0.091" title="Borough Market" group="Markets">
      <template data-icon><span class="pin" data-category="Markets"></span></template>
    </maplace-location>
    <maplace-location location-id="camden-market" lat="51.5413" lng="-0.146" title="Camden Market" group="Markets">
      <template data-icon><span class="pin" data-category="Markets"></span></template>
    </maplace-location>
    <maplace-location location-id="spitalfields" lat="51.5197" lng="-0.0754" title="Old Spitalfields Market" group="Markets">
      <template data-icon><span class="pin" data-category="Markets"></span></template>
    </maplace-location>
    <maplace-location location-id="british-library" lat="51.5299" lng="-0.1277" title="British Library" group="Talks">
      <template data-icon><span class="pin" data-category="Talks"></span></template>
    </maplace-location>
    <maplace-location location-id="conway-hall" lat="51.5203" lng="-0.1188" title="Conway Hall" group="Talks">
      <template data-icon><span class="pin" data-category="Talks"></span></template>
    </maplace-location>
    <maplace-location location-id="royal-institution" lat="51.5098" lng="-0.1425" title="Royal Institution" group="Talks">
      <template data-icon><span class="pin" data-category="Talks"></span></template>
    </maplace-location>
  </maplace-map>
</div>
<script>
  // The legend, a list view of your own: a chip per category, in the venues' order, showing that
  // category alone, or every one again once pressed. The chips are made once, so a chip pressed
  // from the keyboard keeps its focus; a store change only moves the press.
  Maplace.defineListView('maplibre-whats-on-legend', (maplace) => {
    const shownAlone = () => {
      const groups = maplace.getSnapshot().filter?.groups;
      return groups?.length === 1 ? groups[0] : undefined;
    };
    const legend = document.createElement('fieldset');
    legend.className = 'event-legend';
    legend.setAttribute('aria-label', 'Categories');
    const categories = new Set(maplace.getSnapshot().locations.flatMap(({ group }) => group ?? []));
    const chips = [...categories].map((category) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'category-chip';
      chip.dataset.category = category;
      chip.setAttribute('aria-pressed', 'false');
      chip.textContent = category;
      chip.addEventListener('click', () => maplace.setFilter(shownAlone() === category ? undefined : [category]));
      return chip;
    });
    legend.append(...chips);
    let pressed;
    const pressShownAlone = () => {
      const alone = shownAlone();
      if (alone === pressed) return;
      pressed = alone;
      for (const chip of chips) chip.setAttribute('aria-pressed', String(chip.dataset.category === alone));
    };
    pressShownAlone();
    const unsubscribe = maplace.subscribe(pressShownAlone);
    return { element: legend, destroy: () => { unsubscribe(); legend.remove(); } };
  });

  // Every venue fitted, with room at the edges for the count and the legend over the map, as the
  // map opens; then the count over the map: how many venues are shown, of all of them, said again
  // when that changes.
  {
    const maplace = document.getElementById('whats-on-maplibre-map').maplace;
    maplace.fitAll({ padding: 80 });
    const count = document.getElementById('whats-on-maplibre-count');
    const writeCount = () => {
      const snapshot = maplace.getSnapshot();
      const shown = Maplace.listedLocations(snapshot).length;
      const total = snapshot.locations.length;
      const text = shown === total ? `${total} venues` : `${shown} of ${total} venues`;
      if (count.textContent !== text) count.textContent = text;
    };
    writeCount();
    maplace.subscribe(writeCount);

    // Beside it, the name of the venue selected, marked with its category for its colour; hidden
    // while none is. Not a live region: maplace says each selection to a screen reader already.
    const name = document.getElementById('whats-on-maplibre-selected');
    const writeName = (id) => {
      const selected = maplace.getSnapshot().locations.find((location) => location.id === id);
      name.hidden = selected === undefined;
      name.textContent = selected?.title ?? '';
      name.dataset.category = selected?.group ?? '';
    };
    writeName(maplace.getSnapshot().selectedId);
    maplace.on('selectionChange', ({ id }) => writeName(id));
  }
</script>
