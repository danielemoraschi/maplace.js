<!doctype html>
<!-- The page react.tsx renders into: what the module mounts on, and the module, which brings maplibre-gl and its stylesheet. -->
<style>
  /* The frame: a dark page of its own around a rounded map and, beside it, a card. */
  #whats-on-maplibre-react-root { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; border-radius: 16px; background: #1c1d21; }
  #whats-on-maplibre-react-root .map { flex: 3 1 22rem; min-width: 0; height: 26rem; border-radius: 12px; overflow: hidden; }
  /* Each category's colour, which its pins and its chip take. */
  #whats-on-maplibre-react-root [data-category="Theatre"] { --category: #e4572e; }
  #whats-on-maplibre-react-root [data-category="Concerts"] { --category: #8e44ad; }
  #whats-on-maplibre-react-root [data-category="Markets"] { --category: #2a9d8f; }
  #whats-on-maplibre-react-root [data-category="Talks"] { --category: #c48a00; }
  #whats-on-maplibre-react-root .pin {
    display: block;
    box-sizing: border-box;
    width: 22px;
    height: 22px;
    border: 3px solid #fff;
    border-radius: 50%;
    background: var(--category);
    box-shadow: 0 1px 4px rgb(0 0 0 / 40%);
    cursor: pointer;
  }
  #whats-on-maplibre-react-root [data-hovered] > .pin { transform: translateY(-2px); }
  #whats-on-maplibre-react-root [data-selected] > .pin { transform: scale(1.25); box-shadow: 0 0 0 2px var(--category), 0 2px 6px rgb(0 0 0 / 45%); }
  /* maplace's panel on the map, made nothing, so the count and the legend are the page's own. */
  #whats-on-maplibre-react-root .maplace-control { padding: 0; background: none; box-shadow: none; }
  #whats-on-maplibre-react-root .event-count, #whats-on-maplibre-react-root .event-selected, #whats-on-maplibre-react-root .event-legend {
    background: rgb(28 29 33 / 88%);
    color: #f2f2f3;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  #whats-on-maplibre-react-root .event-count { padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-react-root .event-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #whats-on-maplibre-react-root .event-selected { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; }
  #whats-on-maplibre-react-root .event-selected::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-react-root .event-selected[hidden] { display: none; }
  #whats-on-maplibre-react-root .event-legend { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; margin: 0; padding: 4px; border: 0; border-radius: 18px; }
  /* On a phone, the four chips two by two rather than three and one. */
  @media (width < 30rem) {
    #whats-on-maplibre-react-root .event-legend { display: grid; grid-template-columns: 1fr 1fr; }
  }
  #whats-on-maplibre-react-root .category-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #whats-on-maplibre-react-root .category-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-react-root .category-chip:hover { background: rgb(255 255 255 / 12%); }
  #whats-on-maplibre-react-root .category-chip[aria-pressed="true"] { background: #f2f2f3; color: #1c1d21; }
  #whats-on-maplibre-react-root .category-chip:focus-visible { outline: 2px solid #f2f2f3; outline-offset: 2px; }
  /* The card beside the map, under it where there is no room: the venue selected, or a word
     asking for one. */
  #whats-on-maplibre-react-root .venue-card {
    flex: 1 1 14rem;
    box-sizing: border-box;
    padding: 16px 18px;
    border-radius: 12px;
    background: #26272c;
    color: #f2f2f3;
    font: 400 14px/1.4 system-ui, sans-serif;
  }
  #whats-on-maplibre-react-root .venue-empty { margin: 0; color: #a5a6ad; }
  #whats-on-maplibre-react-root .venue { padding-left: 12px; border-left: 3px solid var(--category); }
  #whats-on-maplibre-react-root .venue-category { display: flex; align-items: center; gap: 6px; margin: 0; color: #c9cad0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  #whats-on-maplibre-react-root .venue-category::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--category); }
  #whats-on-maplibre-react-root .venue-name { margin: 6px 0 14px; font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1.2; }
  #whats-on-maplibre-react-root .venue dl { display: grid; gap: 12px; margin: 0; }
  #whats-on-maplibre-react-root .venue dt { color: #a5a6ad; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  #whats-on-maplibre-react-root .venue dd { margin: 2px 0 0; }
</style>
<div id="whats-on-maplibre-react-root"></div>
<script type="module" src="./react.tsx"></script>
