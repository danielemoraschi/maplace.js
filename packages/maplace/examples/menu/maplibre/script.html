<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, the checkbox and what the map mounts on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #menu-maplibre-script-map { height: 24rem; }
</style>
<p><label><input type="checkbox" id="menu-maplibre-script-north-only" /> North only</label></p>
<div id="menu-maplibre-script-map"></div>
<script type="module">
  const maplace = Maplace.createMapLibreMap("#menu-maplibre-script-map", {
    locations: [
      { id: "rome", lat: 41.9028, lng: 12.4964, title: "Rome", group: "Centre" },
      { id: "milan", lat: 45.4642, lng: 9.19, title: "Milan", group: "North" },
      { id: "turin", lat: 45.0703, lng: 7.6869, title: "Turin", group: "North" },
    ],
    list: { as: "select", heading: "Choose a location:", fitAllLabel: "All cities" },
  });

  const northOnly = document.querySelector("#menu-maplibre-script-north-only");
  northOnly?.addEventListener("change", () => {
    maplace.setFilter(northOnly.checked ? ["North"] : undefined);
  });
</script>
