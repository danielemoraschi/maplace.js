<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- A native <select> on the map, top right, grouped by region; the checkbox shows the North only. -->
<p><label><input type="checkbox" id="menu-maplibre-north-only" /> North only</label></p>
<maplace-map id="menu-maplibre-map" list="select" list-position="top-right"
  list-heading="Choose a location:" fit-all fit-all-label="All cities">
  <maplace-location location-id="london" lat="51.5074" lng="-0.1278" title="London" group="South"></maplace-location>
  <maplace-location location-id="edinburgh" lat="55.9533" lng="-3.1883" title="Edinburgh" group="North"></maplace-location>
  <maplace-location location-id="belfast" lat="54.5973" lng="-5.9301" title="Belfast" group="North"></maplace-location>
</maplace-map>
<script>
  document.getElementById('menu-maplibre-north-only').addEventListener('change', (event) => {
    document.getElementById('menu-maplibre-map').maplace.setFilter(event.target.checked ? ['North'] : undefined);
  });
</script>
