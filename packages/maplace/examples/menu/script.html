<!doctype html>
<!-- A page of your own script: the CDN script, the checkbox and what the map mounts on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #menu-script-map { height: 24rem; }
</style>
<p><label><input type="checkbox" id="menu-script-north-only" /> North only</label></p>
<div id="menu-script-map"></div>
<script type="module">
  const maplace = Maplace.createGoogleMap("#menu-script-map", {
    apiKey: "YOUR_KEY",
    locations: [
      { id: "london", lat: 51.5074, lng: -0.1278, title: "London", group: "South" },
      { id: "edinburgh", lat: 55.9533, lng: -3.1883, title: "Edinburgh", group: "North" },
      { id: "belfast", lat: 54.5973, lng: -5.9301, title: "Belfast", group: "North" },
    ],
    list: { as: "select", heading: "Choose a location:", fitAll: true, fitAllLabel: "All cities" },
  });

  const northOnly = document.querySelector("#menu-script-north-only");
  northOnly?.addEventListener("change", () => {
    maplace.setFilter(northOnly.checked ? ["North"] : undefined);
  });
</script>
