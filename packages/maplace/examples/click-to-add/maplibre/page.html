<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- A click on the map adds a pin there, and every pin drags: editable, written back to the store. -->
<maplace-map id="click-to-add-maplibre-map" center="44,11" zoom="6">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome" editable></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan" editable></maplace-location>
</maplace-map>
<script>
  const clickToAddMapLibreMap = document.getElementById('click-to-add-maplibre-map');
  let clickToAddMapLibrePins = 0;
  clickToAddMapLibreMap.addEventListener('maplace-mapclick', (event) => {
    clickToAddMapLibrePins += 1;
    const pin = { id: `pin-${clickToAddMapLibrePins}`, ...event.detail.position, title: `Pin ${clickToAddMapLibrePins}`, editable: true };
    clickToAddMapLibreMap.locations = [...clickToAddMapLibreMap.locations, pin];
  });
</script>
