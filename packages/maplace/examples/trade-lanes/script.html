<!doctype html>
<!-- A page of your own script: the CDN script, what the map and its list mount on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #trade-lanes-script-map-and-list { display: flex; height: 24rem; }
  #trade-lanes-script-map { flex: 1 1 auto; min-width: 0; }
  #trade-lanes-script-list { display: contents; }
  #trade-lanes-script-list .maplace-list-view { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #trade-lanes-script-map-and-list { flex-direction: column; }
    #trade-lanes-script-list .maplace-list-view { flex: none; max-height: 40%; }
  }
</style>
<div id="trade-lanes-script-map-and-list">
  <div id="trade-lanes-script-map"></div>
  <div id="trade-lanes-script-list"></div>
</div>
<script type="module">
  // Sea and air lanes, each coloured by its mode. The volumes are made up, for the example.
  // A curve bows each lane for the look: to the left of travel, to the right when negative.
  const colours = { Sea: "#0f766e", Air: "#7c3aed" };
  const routes = [
    {
      id: "shanghai-los-angeles",
      title: "Shanghai → Los Angeles",
      mode: "Sea",
      from: { lat: 31.2304, lng: 121.4737 },
      to: { lat: 34.0522, lng: -118.2437 },
      curve: 0.2,
      volume: "24,800 TEU a week",
    },
    {
      id: "singapore-rotterdam",
      title: "Singapore → Rotterdam",
      mode: "Sea",
      from: { lat: 1.3521, lng: 103.8198 },
      to: { lat: 51.9244, lng: 4.4777 },
      curve: 0.2,
      volume: "9,400 TEU a week",
    },
    {
      id: "rotterdam-new-york",
      title: "Rotterdam → New York",
      mode: "Sea",
      from: { lat: 51.9244, lng: 4.4777 },
      to: { lat: 40.7128, lng: -74.006 },
      curve: -0.2,
      volume: "3,100 TEU a week",
    },
    {
      id: "hong-kong-anchorage",
      title: "Hong Kong → Anchorage",
      mode: "Air",
      from: { lat: 22.3193, lng: 114.1694 },
      to: { lat: 61.2181, lng: -149.9003 },
      curve: 0.2,
      volume: "1,500 t a week",
    },
    {
      id: "frankfurt-chicago",
      title: "Frankfurt → Chicago",
      mode: "Air",
      from: { lat: 50.1109, lng: 8.6821 },
      to: { lat: 41.8781, lng: -87.6298 },
      curve: -0.2,
      volume: "820 t a week",
    },
    {
      id: "dubai-nairobi",
      title: "Dubai → Nairobi",
      mode: "Air",
      from: { lat: 25.2048, lng: 55.2708 },
      to: { lat: -1.2921, lng: 36.8219 },
      curve: 0.2,
      volume: "310 t a week",
    },
  ];
  const lanes = routes.map(({ id, title, mode, from, to, curve, volume }) => ({
    id,
    type: "polyline",
    title,
    group: mode,
    path: [from, to],
    curve,
    style: { stroke: colours[mode] },
    hoveredStyle: { strokeWidth: 5 },
    selectedStyle: { strokeWidth: 6 },
    content: volume,
  }));
  Maplace.createGoogleMap("#trade-lanes-script-map", {
    apiKey: "YOUR_KEY",
    locations: lanes,
    list: { container: "#trade-lanes-script-list", heading: "Trade lanes" },
  });
</script>
