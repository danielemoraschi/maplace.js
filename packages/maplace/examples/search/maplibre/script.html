<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet and what the map and its list mount on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #search-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #search-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #search-maplibre-script-list { display: contents; }
  #search-maplibre-script-list .maplace-list { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, its half staying that size as the places narrow. */
  @media (width < 40rem) {
    #search-maplibre-script-map-and-list { flex-direction: column; height: 36rem; }
    #search-maplibre-script-list .maplace-list { flex: 0 0 50%; max-height: 50%; }
  }
</style>
<div id="search-maplibre-script-map-and-list">
  <div id="search-maplibre-script-map"></div>
  <div id="search-maplibre-script-list"></div>
</div>
<script type="module">
  Maplace.createMapLibreMap("#search-maplibre-script-map", {
    locations: [
      { id: "rome", lat: 41.9028, lng: 12.4964, title: "Rome", group: "Centre" },
      { id: "bologna", lat: 44.4949, lng: 11.3426, title: "Bologna", group: "Centre", searchText: "pasta" },
      { id: "forli", lat: 44.2227, lng: 12.0407, title: "Forlì", group: "Centre" },
      { id: "milan", lat: 45.4642, lng: 9.19, title: "Milan", group: "North" },
      { id: "turin", lat: 45.0703, lng: 7.6869, title: "Turin", group: "North" },
      {
        id: "genoa",
        lat: 44.4056,
        lng: 8.9463,
        title: "Genoa",
        group: "North",
        searchText: "pasta, harbour",
      },
      {
        id: "naples",
        lat: 40.8518,
        lng: 14.2681,
        title: "Naples",
        group: "South",
        searchText: "pizza, harbour",
      },
      { id: "bari", lat: 41.1171, lng: 16.8719, title: "Bari", group: "South", searchText: "harbour" },
    ],
    list: { container: "#search-maplibre-script-list", searchLabel: "Find a place" },
  });
</script>
