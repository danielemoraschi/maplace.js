<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, what the map and its list mount on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #flights-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #flights-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #flights-maplibre-script-list { display: contents; }
  #flights-maplibre-script-list .maplace-list-view { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #flights-maplibre-script-map-and-list { flex-direction: column; }
    #flights-maplibre-script-list .maplace-list-view { flex: none; max-height: 40%; }
  }
</style>
<div id="flights-maplibre-script-map-and-list">
  <div id="flights-maplibre-script-map"></div>
  <div id="flights-maplibre-script-list"></div>
</div>
<script type="module">
  // London's flights out, each along its great circle, the shortest way on the earth.
  const london = { lat: 51.5074, lng: -0.1278 };
  const cities = [
    { id: "new-york", name: "New York", lat: 40.7128, lng: -74.006 },
    { id: "sao-paulo", name: "São Paulo", lat: -23.5505, lng: -46.6333 },
    { id: "cape-town", name: "Cape Town", lat: -33.9249, lng: 18.4241 },
    { id: "dubai", name: "Dubai", lat: 25.2048, lng: 55.2708 },
    { id: "mumbai", name: "Mumbai", lat: 19.076, lng: 72.8777 },
    { id: "singapore", name: "Singapore", lat: 1.3521, lng: 103.8198 },
    { id: "tokyo", name: "Tokyo", lat: 35.6895, lng: 139.6917 },
    { id: "sydney", name: "Sydney", lat: -33.8688, lng: 151.2093 },
  ];
  const flights = [
    // The cities on the map only; the list holds the flights.
    { id: "london", ...london, title: "London", listed: false },
    ...cities.map(({ id, name, lat, lng }) => ({ id, lat, lng, title: name, listed: false })),
    ...cities.map(({ id, name, lat, lng }) => ({
      id: `london-${id}`,
      type: "polyline",
      title: `London → ${name}`,
      path: [london, { lat, lng }],
      geodesic: true,
      style: { stroke: "#2563eb" },
    })),
  ];
  Maplace.createMapLibreMap("#flights-maplibre-script-map", {
    locations: flights,
    // The earth as a globe, with a toggle on the map to flatten it.
    globe: true,
    list: { container: "#flights-maplibre-script-list", heading: "Flights from London" },
  });
</script>
