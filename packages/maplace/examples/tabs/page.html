<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- The list sits outside the map, styled as tabs above it, starting on the first place; the details panel follows the selection. -->
<style>
  #tabs-map { flex-direction: column; }
  #tabs-map > [role="listbox"] { order: -1; display: flex; flex: none; gap: 0.25rem; padding: 0.25rem 0.5rem 0; }
  #tabs-map > [role="listbox"] > [role="option"] { border: 1px solid transparent; border-bottom: 0; border-radius: 0.375rem 0.375rem 0 0; }
  #tabs-map > [role="listbox"] > [aria-selected="true"] { border-color: currentColor; }
</style>
<maplace-map id="tabs-map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" list selected-id="rome">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan"></maplace-location>
</maplace-map>
<aside id="tabs-details"></aside>
<script>
  const tabsNotes = { rome: 'Capital since 1871.', milan: 'Finance and fashion.' };
  const tabsMap = document.getElementById('tabs-map');
  function showTabsNote(id) {
    document.getElementById('tabs-details').textContent = tabsNotes[id] ?? '';
  }
  showTabsNote(tabsMap.maplace.getSnapshot().selectedId);
  tabsMap.addEventListener('maplace-selectionchange', (event) => showTabsNote(event.detail.id));
</script>
