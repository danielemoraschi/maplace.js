<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- The list sits outside the map, styled as tabs above it; the details panel follows the selection. -->
<style>
  #tabs-map { flex-direction: column; }
  #tabs-map > [role="listbox"] { order: -1; display: flex; flex: none; gap: 0.25rem; border-bottom: 1px solid; }
  #tabs-map > [role="listbox"] > [role="option"] { border-radius: 0.375rem 0.375rem 0 0; }
  #tabs-map > [role="listbox"] > [aria-selected="true"] { box-shadow: inset 0 -2px currentColor; }
</style>
<maplace-map id="tabs-map" api-key="YOUR_KEY" map-id="DEMO_MAP_ID" list>
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan"></maplace-location>
</maplace-map>
<aside id="tabs-details"></aside>
<script>
  document.getElementById('tabs-map').addEventListener('maplace-selectionchange', (event) => {
    document.getElementById('tabs-details').textContent = event.detail.id ?? '';
  });
</script>
