<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element.iife.js"></script>
<!-- The list sits outside the map, styled as tabs above it, starting on the first place; the chosen tab's details sit right below the tabs, above the map, and follow the selection. -->
<style>
  #tabs-map { flex-direction: column; }
  #tabs-map > [role="listbox"] { order: -2; display: flex; flex: none; gap: 0.25rem; padding: 0.5rem 0.75rem 0; box-shadow: inset 0 -1px color-mix(in srgb, currentColor 25%, transparent); }
  #tabs-map > [role="listbox"] > [role="option"] { padding: 0.5rem 1rem; border: 1px solid transparent; border-bottom: 0; border-radius: 0.5rem 0.5rem 0 0; }
  #tabs-map > [role="listbox"] > [aria-selected="true"] { position: relative; border-color: color-mix(in srgb, currentColor 25%, transparent); background: Canvas; font-weight: 600; }
  #tabs-map > #tabs-details { order: -1; padding: 0.75rem 1.25rem 1rem; line-height: 1.5; }
</style>
<maplace-map id="tabs-map" api-key="YOUR_KEY" list selected-id="rome">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome" zoom="6"></maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan" zoom="6"></maplace-location>
  <aside id="tabs-details"></aside>
</maplace-map>
<script>
  const tabsNotes = { rome: 'Capital since 1871.', milan: 'Finance and fashion.' };
  const tabsMap = document.getElementById('tabs-map');
  function showTabsNote(id) {
    document.getElementById('tabs-details').textContent = tabsNotes[id] ?? '';
  }
  showTabsNote(tabsMap.maplace.getSnapshot().selectedId);
  tabsMap.addEventListener('maplace-selectionchange', (event) => showTabsNote(event.detail.id));
</script>
