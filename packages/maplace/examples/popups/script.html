<!doctype html>
<!-- A page of your own script: the CDN script, what the map mounts on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #popups-script-map { height: 24rem; }
</style>
<div id="popups-script-map"></div>
<script type="module">
  Maplace.createGoogleMap("#popups-script-map", {
    apiKey: "YOUR_KEY",
    locations: [
      {
        id: "rome",
        lat: 41.9028,
        lng: 12.4964,
        title: "Rome",
        content: () => popupOf("Capital of Italy."),
      },
      {
        id: "milan",
        lat: 45.4642,
        lng: 9.19,
        title: "Milan",
        content: () => popupOf("Finance and fashion."),
      },
      {
        id: "venice",
        lat: 45.4408,
        lng: 12.3155,
        title: "Venice",
        content: () =>
          popupWithList("A city on 118 islands.", ["Over 400 bridges", "No cars, only boats"]),
      },
    ],
    view: { kind: "center", center: { lat: 44, lng: 11 }, zoom: 6 },
    popup: { openInMapsLink: true, directionsLink: true },
  });

  /** A popup's content: a line about the place, under its title (the popup's heading). */
  function popupOf(about) {
    const text = document.createElement("p");
    text.textContent = about;
    return text;
  }

  /** A popup's line, then a list under it: any markup a node can hold. */
  function popupWithList(about, facts) {
    const list = document.createElement("ul");
    list.append(...facts.map(listItemOf));
    const popup = document.createElement("div");
    popup.append(popupOf(about), list);
    return popup;
  }

  function listItemOf(text) {
    const item = document.createElement("li");
    item.textContent = text;
    return item;
  }
</script>
