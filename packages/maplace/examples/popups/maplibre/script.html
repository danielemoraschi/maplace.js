<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, what the map mounts on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- This example's look lives in the examples' styles/popups.css, which every version links. -->
<link rel="stylesheet" href="../../styles/popups.css">
<style>
  #popups-maplibre-script-map { height: 24rem; }
</style>
<div id="popups-maplibre-script-map"></div>
<template id="popups-maplibre-script-card">
  <div class="place-card">
    <img class="place-photo" alt="">
    <p class="place-meta"><span class="place-category"></span> · Open <span class="place-hours"></span></p>
    <p class="place-rating">★ <span class="place-score"></span> <span class="place-reviews"></span></p>
  </div>
</template>
<script type="module">
  // The ratings, reviews and hours are sample figures.
  const places = [
    {
      id: "colosseum",
      lat: 41.8902,
      lng: 12.4922,
      title: "Colosseum",
      data: {
        photo: "/examples/data/photos/colosseum.webp",
        alt: "The Colosseum's arches behind a row of cypresses",
        category: "Landmark",
        rating: "4.7",
        reviews: "412,301",
        hours: "9:00–19:15",
      },
    },
    {
      id: "duomo",
      lat: 45.4641,
      lng: 9.1919,
      title: "Duomo di Milano",
      data: {
        photo: "/examples/data/photos/duomo.webp",
        alt: "The Duomo's white Gothic facade over its square",
        category: "Cathedral",
        rating: "4.8",
        reviews: "198,442",
        hours: "9:00–19:00",
      },
    },
    {
      id: "st-marks",
      lat: 45.4345,
      lng: 12.3397,
      title: "St Mark's Basilica",
      data: {
        photo: "/examples/data/photos/st-marks.webp",
        alt: "The mosaics and domes of St Mark's Basilica's facade",
        category: "Basilica",
        rating: "4.7",
        reviews: "156,018",
        hours: "9:30–17:15",
      },
    },
  ];
  Maplace.createMapLibreMap("#popups-maplibre-script-map", {
    locations: places.map((place) => ({ ...place, content: () => placeCard(place.data) })),
    view: { kind: "center", center: { lat: 44, lng: 11 }, zoom: 6 },
    popup: { openInMapsLink: true, directionsLink: true },
  });

  /** A place's card: the page's template, filled with its photo, category, hours and rating. */
  function placeCard(place) {
    const template = document.querySelector("#popups-maplibre-script-card");
    const card = template.content.cloneNode(true);
    const photo = card.querySelector(".place-photo");
    photo.src = place.photo;
    photo.alt = place.alt;
    const write = (name, text) => {
      card.querySelector(`.place-${name}`).textContent = text;
    };
    write("category", place.category);
    write("hours", place.hours);
    write("score", place.rating);
    write("reviews", `(${place.reviews} reviews)`);
    return card;
  }
</script>
