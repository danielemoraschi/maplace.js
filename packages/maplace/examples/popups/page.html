<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<!-- Popups from each place's content, ending in an Open in Maps and a Directions link; Venice's content adds a list. -->
<maplace-map id="popups-map" api-key="YOUR_KEY" center="44,11" zoom="6" open-in-maps-link directions-link>
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome">
    <template><p>Capital of Italy.</p></template>
  </maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan">
    <template><p>Finance and fashion.</p></template>
  </maplace-location>
  <maplace-location location-id="venice" lat="45.4408" lng="12.3155" title="Venice">
    <template>
      <p>A city on 118 islands.</p>
      <ul>
        <li>Over 400 bridges</li>
        <li>No cars, only boats</li>
      </ul>
    </template>
  </maplace-location>
</maplace-map>
