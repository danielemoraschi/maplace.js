<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet and what the map and its list mount on, and the map made with Maplace; the quakes as a heatmap by magnitude, the volcanoes as pins. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #earthquakes-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #earthquakes-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #earthquakes-maplibre-script-list { display: contents; }
  #earthquakes-maplibre-script-list .maplace-list { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, its half staying that size as the quakes narrow. */
  @media (width < 40rem) {
    #earthquakes-maplibre-script-map-and-list { flex-direction: column; height: 36rem; }
    #earthquakes-maplibre-script-list .maplace-list { flex: 0 0 50%; max-height: 50%; }
  }
</style>
<div id="earthquakes-maplibre-script-map-and-list">
  <div id="earthquakes-maplibre-script-map"></div>
  <div id="earthquakes-maplibre-script-list"></div>
</div>
<script type="module">
  // The quakes, each weighing its magnitude, in the group the heatmap draws; the volcanoes, pins.
  const [quakes, volcanoes] = await Promise.all([
    fetch("/examples/data/earthquakes.json").then((response) => response.json()),
    fetch("/examples/data/volcanoes.json").then((response) => response.json()),
  ]);
  Maplace.createMapLibreMap("#earthquakes-maplibre-script-map", {
    locations: [...quakes, ...volcanoes],
    heatmap: { groups: ["Quakes"] },
    view: { kind: "center", center: { lat: 20, lng: 160 }, zoom: 2 },
    list: {
      container: "#earthquakes-maplibre-script-list",
      search: true,
      searchLabel: "Find a quake or a volcano",
      groupFilter: true,
    },
  });
</script>
