<!doctype html>
<!-- A page of your own script: the CDN script and what the map and its list mount on, and the map made with Maplace, which adds Maps JS with your key; the quakes as a heatmap by magnitude, the volcanoes as pins. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #earthquakes-script-map-and-list { display: flex; height: 24rem; }
  #earthquakes-script-map { flex: 1 1 auto; min-width: 0; }
  #earthquakes-script-list { display: contents; }
  #earthquakes-script-list .maplace-list { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, its half staying that size as the quakes narrow. */
  @media (width < 40rem) {
    #earthquakes-script-map-and-list { flex-direction: column; height: 36rem; }
    #earthquakes-script-list .maplace-list { flex: 0 0 50%; max-height: 50%; }
  }
</style>
<p id="earthquakes-script-filters">
  <label><input type="checkbox" value="quakes" checked /> Quakes</label>
  <label><input type="checkbox" value="volcanoes" checked /> Volcanoes</label>
</p>
<div id="earthquakes-script-map-and-list">
  <div id="earthquakes-script-map"></div>
  <div id="earthquakes-script-list"></div>
</div>
<script type="module">
  // The quakes, each weighing its magnitude, in the group the heatmap draws; the volcanoes, pins.
  const [quakes, volcanoes] = await Promise.all([
    fetch("/examples/data/earthquakes.json").then((response) => response.json()),
    fetch("/examples/data/volcanoes.json").then((response) => response.json()),
  ]);
  const maplace = Maplace.createGoogleMap("#earthquakes-script-map", {
    apiKey: "YOUR_KEY",
    locations: [...quakes, ...volcanoes],
    heatmap: { groups: ["quakes"] },
    view: { kind: "center", center: { lat: 20, lng: 160 }, zoom: 2 },
    list: { container: "#earthquakes-script-list", search: true, searchLabel: "Find a quake or a volcano" },
  });

  // The checkboxes show the groups ticked, keeping what the search box found.
  const filters = document.querySelector("#earthquakes-script-filters");
  filters.addEventListener("change", () => {
    const ticked = filters.querySelectorAll(":checked");
    maplace.setFilter({ ...maplace.getSnapshot().filter, groups: Array.from(ticked, (box) => box.value) });
  });
</script>
