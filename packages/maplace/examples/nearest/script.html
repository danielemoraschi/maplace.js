<!doctype html>
<!-- A page of your own script: the CDN script, what the map and its list mount on, and the map made with Maplace, which adds Maps JS with your key. -->
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element.iife.js"></script>
<style>
  #nearest-script-map-and-list { display: flex; height: 24rem; }
  #nearest-script-map { flex: 1 1 auto; min-width: 0; }
  #nearest-script-list { display: contents; }
  #nearest-script-list [role="listbox"] { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #nearest-script-map-and-list { flex-direction: column; }
    #nearest-script-list [role="listbox"] { flex: none; max-height: 40%; }
  }
</style>
<div id="nearest-script-map-and-list">
  <div id="nearest-script-map"></div>
  <div id="nearest-script-list"></div>
</div>
<script type="module">
  Maplace.createGoogleMap("#nearest-script-map", {
    apiKey: "YOUR_KEY",
    locations: [
      { id: "london", lat: 51.5074, lng: -0.1278, title: "London" },
      { id: "bristol", lat: 51.4545, lng: -2.5879, title: "Bristol" },
      { id: "birmingham", lat: 52.4862, lng: -1.8904, title: "Birmingham" },
      { id: "manchester", lat: 53.4808, lng: -2.2426, title: "Manchester" },
      { id: "leeds", lat: 53.8008, lng: -1.5491, title: "Leeds" },
    ],
    list: { container: "#nearest-script-list", sort: "distance" },
    myLocation: true,
  });
</script>
