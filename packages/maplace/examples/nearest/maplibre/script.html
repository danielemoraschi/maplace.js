<!doctype html>
<!-- A page of your own script: the MapLibre CDN script, which bundles maplibre-gl and its stylesheet, what the map and its list mount on, and the map made with Maplace. -->
<script src="https://cdn.jsdelivr.net/npm/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<style>
  #nearest-maplibre-script-map-and-list { display: flex; height: 24rem; }
  #nearest-maplibre-script-map { flex: 1 1 auto; min-width: 0; }
  #nearest-maplibre-script-list { display: contents; }
  #nearest-maplibre-script-list [role="listbox"] { flex: 0 1 16rem; }
  /* On a phone the list goes under the map, as the element's does. */
  @media (width < 40rem) {
    #nearest-maplibre-script-map-and-list { flex-direction: column; }
    #nearest-maplibre-script-list [role="listbox"] { flex: none; max-height: 40%; }
  }
</style>
<div id="nearest-maplibre-script-map-and-list">
  <div id="nearest-maplibre-script-map"></div>
  <div id="nearest-maplibre-script-list"></div>
</div>
<script type="module">
  Maplace.createMapLibreMap("#nearest-maplibre-script-map", {
    locations: [
      { id: "rome", lat: 41.9028, lng: 12.4964, title: "Rome" },
      { id: "naples", lat: 40.8518, lng: 14.2681, title: "Naples" },
      { id: "bologna", lat: 44.4949, lng: 11.3426, title: "Bologna" },
      { id: "milan", lat: 45.4642, lng: 9.19, title: "Milan" },
      { id: "turin", lat: 45.0703, lng: 7.6869, title: "Turin" },
    ],
    list: { container: "#nearest-maplibre-script-list", sort: "distance" },
    myLocation: true,
  });
</script>
