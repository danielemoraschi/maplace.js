<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@maplacejs/maplace@1/dist/maplace-element-maplibre.iife.js"></script>
<!-- Places in a list beside the map; the "My location" button on the map sorts it nearest first, each entry saying how far. -->
<maplace-map id="nearest-maplibre-map" list list-sort="distance" my-location>
  <maplace-location location-id="london" lat="51.5074" lng="-0.1278" title="London"></maplace-location>
  <maplace-location location-id="bristol" lat="51.4545" lng="-2.5879" title="Bristol"></maplace-location>
  <maplace-location location-id="birmingham" lat="52.4862" lng="-1.8904" title="Birmingham"></maplace-location>
  <maplace-location location-id="manchester" lat="53.4808" lng="-2.2426" title="Manchester"></maplace-location>
  <maplace-location location-id="leeds" lat="53.8008" lng="-1.5491" title="Leeds"></maplace-location>
</maplace-map>
