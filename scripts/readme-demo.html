<!doctype html>
<title>maplacejs</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #fff;
    font: 16px/1.4 system-ui, sans-serif;
    color: #111;
  }
  maplace-map {
    height: 100%;
  }
  .pin {
    display: block;
    width: 18px;
    height: 18px;
    border: 3px solid #111;
    border-radius: 50%;
    background: #f47b74;
  }
  [data-selected] .pin {
    width: 26px;
    height: 26px;
  }
  /* A recording shows no mouse: this is where it is. */
  #pointer {
    position: fixed;
    z-index: 100;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border: 2px solid #fff;
    border-radius: 50%;
    background: rgb(17 17 17 / 70%);
    pointer-events: none;
  }
</style>
<script src="maplace-element-maplibre.iife.js"></script>
<maplace-map id="demo" list map-style="https://tiles.openfreemap.org/styles/positron">
  <maplace-location location-id="rome" lat="41.9028" lng="12.4964" title="Rome">
    <template data-icon><span class="pin"></span></template>
    <template><p>Capital of Italy.</p></template>
  </maplace-location>
  <maplace-location location-id="milan" lat="45.4642" lng="9.19" title="Milan">
    <template data-icon><span class="pin"></span></template>
    <template><p>Finance and fashion.</p></template>
  </maplace-location>
  <maplace-location location-id="venice" lat="45.4408" lng="12.3155" title="Venice">
    <template data-icon><span class="pin"></span></template>
    <template><p>Canals and bridges.</p></template>
  </maplace-location>
</maplace-map>
<div id="pointer"></div>
<script>
  const pointer = document.getElementById("pointer");
  addEventListener("mousemove", ({ clientX, clientY }) => {
    pointer.style.left = `${clientX}px`;
    pointer.style.top = `${clientY}px`;
  });
</script>
