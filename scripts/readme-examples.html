<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maplace.js: the README's picture of the examples</title>
    <!--
      The README's picture of the examples (W73), drawn by scripts/readme-examples.ts. The six
      large cards come first: the grid places its cards in this order, and small ones first would
      take the centre's columns. Each run of four small cards after them fills one row's columns
      1, 2, 5 and 6, the outer two fading out.
    -->
    <base href="../apps/site/src/assets/shots/thumbnails/" />
    <style>
      main {
        /* A large card is two small ones and the gap between them, across and down. */
        --card: 200px;
        --gap: 16px;
        --pair: calc(2 * var(--card) + var(--gap));
        display: grid;
        grid-template-columns: repeat(2, var(--card)) repeat(2, var(--pair)) repeat(2, var(--card));
        grid-auto-rows: calc(var(--card) / 1.6); /* the thumbnails' 640×400 */
        grid-auto-flow: dense;
        gap: var(--gap);
        width: max-content;
        /* Clear between the side columns, so the large cards never fade. */
        mask-image: linear-gradient(to right, transparent, #000 var(--pair) calc(100% - var(--pair)), transparent);
      }
      .large { grid-row: span 2; grid-column: 3; }
      .large:nth-child(even) { grid-column: 4; }
      img {
        width: 100%; height: 100%; box-sizing: border-box; object-fit: cover;
        border: 1px solid rgb(128 128 128 / 0.35); border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="large" src="audience.jpg" alt="" />
      <img class="large" src="circles.jpg" alt="" />
      <img class="large" src="share-by-country.jpg" alt="" />
